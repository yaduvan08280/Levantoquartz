window.addEventListener('resize', syncVV);
syncVV();

var SG_PAGE = 40;
var GRADES = ['A', 'B', 'C', 'E', 'A#', 'B#'];

/* ---- the card left in the form: what has been picked, and one big button -- */
function buildSlabGrade(f) {
  var wrap = el('div', 'sglist');
  wrap.dataset.ctl = 'slabgrade';
  if (f.grades && f.grades.length) GRADES = f.grades;

  var add = el('button', 'sg-add');
  add.type = 'button';
  add.id = 'f_' + f.id;
  /* Drawn, not a glyph: the magnifier characters render as a keyhole, a
     circle or nothing at all depending on the phone's font. */
  add.innerHTML = '<span class="sg-mag" aria-hidden="true">' +
                  '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" ' +
                  'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
                  '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>' +
                  '</svg></span>' +
                  '<span class="sg-addt"><b>Search and add slabs</b>' +
                  '<i id="sgAddSub">Opens full screen — type a slab number</i></span>';
  add.onclick = function () { openSlabPicker(f); };
  wrap.appendChild(add);

  var head = el('div', 'sg-head');
  var cnt = el('span', 'sg-cnt', '');
  var clr = el('button', 'link', 'Clear all');
  clr.type = 'button';
  head.appendChild(cnt);
  head.appendChild(clr);
  wrap.appendChild(head);

  var list = el('div', 'sg-sel');
  wrap.appendChild(list);

  function rows() { return S.values[f.id] || []; }
  function commit(next) {
    if (next.length) S.values[f.id] = next; else delete S.values[f.id];
    setVal(f, next);
    if (!next.length) delete S.values[f.id];
  }

  function draw() {
    var r = rows();
    cnt.textContent = r.length
      ? r.length + ' slab' + (r.length === 1 ? '' : 's') + ' in this container'
      : 'No slabs picked yet';
    head.classList.toggle('empty', !r.length);
    clr.style.display = r.length ? '' : 'none';
    var sub = $('#sgAddSub');
    if (sub) {
      sub.textContent = SG.loading ? 'Loading the slab list…'
        : SG.opts.length ? (SG.opts.length - r.length).toLocaleString() +
                           ' still available — type a slab number'
                         : 'No slabs are waiting to be dispatched.';
    }

    list.innerHTML = '';
    if (!r.length) {
      list.appendChild(el('div', 'ck-empty', 'Tap the button above to start picking.'));
      return;
    }
    var frag = document.createDocumentFragment();
    r.forEach(function (x) { frag.appendChild(sgRow(x.slab, x.grade, true, '', true)); });
    list.appendChild(frag);
  }

  /* One tap removes a slab here; the grade select changes its grade. This is
     the review of a finished container, so removing is the useful action. */
  list.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.sg-x');
    if (!b) return;
    var slab = b.closest('.sg-row').dataset.slab;
    buzz();
    commit(rows().filter(function (x) { return x.slab !== slab; }));
    draw();
  });
  list.addEventListener('change', function (e) {
    var n = e.target;
    if (!n.classList || !n.classList.contains('sg-g')) return;
    var slab = n.closest('.sg-row').dataset.slab;
    commit(rows().map(function (x) {
      return x.slab === slab ? { slab: slab, grade: n.value } : x;
    }));
    draw();
  });
  clr.onclick = function () {
    if (!rows().length) return;
    if (!confirm('Remove all ' + rows().length + ' slabs from this container?')) return;
    commit([]);
    draw();
  };

  wrap._redraw = draw;
  wrap._set = function (v) { S.values[f.id] = v || []; draw(); };
  wrap._field = f;
  draw();
  return wrap;
}

/** One row: slab, grade dropdown immediately to its right, and either a tick
    box (in the picker) or a remove button (in the form's review list). */
function sgRow(slab, grade, on, q, removable) {
  var row = el('label', 'sg-row' + (on ? ' on' : ''));
  row.dataset.slab = slab;

  if (!removable) {
    var box = el('input');
    box.type = 'checkbox';
    box.checked = on;
    box.value = slab;
    row.appendChild(box);
  }

  var t = el('span', 'sg-s');
  t.innerHTML = highlight(slab, q || '');
  row.appendChild(t);

  var qc = SG.qc[slab] || '';
  var sel = el('select', 'sg-g');
  sel.appendChild(new Option('grade', ''));
  GRADES.forEach(function (g) { sel.appendChild(new Option(g, g)); });
  var cur = on ? (grade || '') : qc;
  sel.value = GRADES.indexOf(cur) === -1 ? '' : cur;
  row.appendChild(sel);

  var tag = el('i', 'sg-tag', '');
  if (on && !sel.value) { row.classList.add('nograde'); tag.textContent = 'grade needed'; }
  else if (on && qc && sel.value !== qc) { row.classList.add('changed'); tag.textContent = 'changed'; }
  else if (qc) tag.textContent = 'QC';
  else tag.textContent = 'no QC grade';
  row.appendChild(tag);

  if (removable) {
    var x = el('button', 'sg-x', '✕');
    x.type = 'button';
    x.setAttribute('aria-label', 'Remove ' + slab);
    row.appendChild(x);
  }
  return row;
}

/* ---- the full-screen picker ------------------------------------------- */
var SB = { field: null, filtered: [], shown: 0, q: '' };

function openSlabPicker(f) {
  SB.field = f;
  SB.q = '';
  $('#sbSearch').value = '';
  $('#sbClear').classList.remove('on');
  sbFilter();
  sheetOpen('#slabSheet', function () { sgCard() && sgCard()._redraw(); });
  syncVV();
  /* Focus straight away: typing a slab number IS the task, and the sheet is
     sized to the visible viewport so the keyboard cannot cover the list. */
  setTimeout(function () { $('#sbSearch').focus(); syncVV(); }, 120);
}

function sgCard() { return document.querySelector('.sglist'); }
function sbRows() { return (SB.field && S.values[SB.field.id]) || []; }
function sbHas(slab) {
  var r = sbRows();
  for (var i = 0; i < r.length; i++) if (r[i].slab === slab) return true;
  return false;
}
function sbCommit(next) {
  var f = SB.field;
  if (next.length) S.values[f.id] = next; else delete S.values[f.id];
  setVal(f, next);
  if (!next.length) delete S.values[f.id];
}

function sbFilter() {
  var q = String(SB.q || '').trim().toUpperCase();
  SB.filtered = q ? SG.opts.filter(function (sl) { return sl.indexOf(q) !== -1; })
                  : SG.opts.slice();
  SB.shown = 0;
  $('#sbList').innerHTML = '';
  $('#sbList').scrollTop = 0;
  sbMore();
  sbStatus();
}

function sbMore() {
  var list = $('#sbList');
  if (!SG.opts.length) {
    list.innerHTML = '<div class="opt-empty">' +
      (SG.loading ? 'Loading slabs…' : 'No slabs are waiting to be dispatched.') + '</div>';
    return;
  }
  if (!SB.filtered.length) {
    if (!SB.shown) list.innerHTML = '<div class="opt-empty">Nothing matches “' +
      esc(String(SB.q).trim()) + '”</div>';
    return;
  }
  var end = Math.min(SB.shown + SG_PAGE, SB.filtered.length);
  var frag = document.createDocumentFragment();
  for (var i = SB.shown; i < end; i++) {
    var sl = SB.filtered[i];
    frag.appendChild(sgRow(sl, sbGrade(sl), sbHas(sl), SB.q, false));
  }
  list.appendChild(frag);
  SB.shown = end;
}

function sbGrade(slab) {
  var r = sbRows();
  for (var i = 0; i < r.length; i++) if (r[i].slab === slab) return r[i].grade;
  return '';
}

function sbStatus() {
  var n = sbRows().length;
  $('#sbCount').textContent = n;
  var q = String(SB.q).trim();
  var strip = $('#sbStrip');
  if (q) {
    strip.textContent = SB.filtered.length
      ? SB.filtered.length.toLocaleString() +
        (SB.filtered.length === 1 ? ' match — press enter to add it' : ' matches — tap to add')
      : 'no match';
  } else {
    strip.textContent = n
      ? n + ' picked · ' + (SG.opts.length - n).toLocaleString() + ' still available'
      : SG.opts.length.toLocaleString() + ' slabs available — type to narrow the list';
  }
}

/* Ticking updates ONE row in place. A rebuild here would reset the scroll and
   can cost the keyboard its focus, which is the whole thing being fixed. */
function sbToggle(slab, on, row) {
  var next = sbRows().slice();
  if (on) {
    if (!sbHas(slab)) {
      var g = SG.qc[slab] || '';
      if (GRADES.indexOf(g) === -1) g = '';
      var sel = row && row.querySelector('.sg-g');
      if (sel && sel.value) g = sel.value;
      next.push({ slab: slab, grade: g });
    }
  } else {
    next = next.filter(function (x) { return x.slab !== slab; });
  }
  sbCommit(next);
  if (row) sbPaint(row, slab, on);
  sbStatus();
}

/** Repaint one row's state without touching the rest of the list. */
function sbPaint(row, slab, on) {
  var sel = row.querySelector('.sg-g');
  var tag = row.querySelector('.sg-tag');
  var box = row.querySelector('input[type=checkbox]');
  var qc = SG.qc[slab] || '';
  if (box) box.checked = on;
  row.classList.toggle('on', on);
  if (on && sel && !sel.value) {
    sel.value = GRADES.indexOf(qc) === -1 ? '' : qc;
  }
  var v = sel ? sel.value : '';
  row.classList.toggle('nograde', on && !v);
  row.classList.toggle('changed', !!(on && qc && v !== qc));
  if (tag) {
    tag.textContent = (on && !v) ? 'grade needed'
      : (on && qc && v !== qc) ? 'changed'
      : qc ? 'QC' : 'no QC grade';
  }
}

$('#sbList').addEventListener('scroll', function () {
  if (this.scrollTop + this.clientHeight > this.scrollHeight - 300 &&
      SB.shown < SB.filtered.length) sbMore();
});

$('#sbList').addEventListener('change', function (e) {
  var n = e.target;
  var row = n.closest && n.closest('.sg-row');
  if (!row) return;
  var slab = row.dataset.slab;

  if (n.type === 'checkbox') { buzz(); sbToggle(slab, n.checked, row); return; }

  if (n.classList.contains('sg-g')) {
    /* Setting a grade on a row that is not ticked is a clear intent to add it. */
    if (!sbHas(slab)) { sbToggle(slab, true, row); return; }
    sbCommit(sbRows().map(function (x) {
      return x.slab === slab ? { slab: slab, grade: n.value } : x;
    }));
    sbPaint(row, slab, true);
    sbStatus();
  }
});

$('#sbSearch').addEventListener('input', function () {
  SB.q = this.value;
  $('#sbClear').classList.toggle('on', !!this.value);
  sbFilter();
});

/* Typing a whole slab number and pressing enter adds it and clears the box,
   ready for the next one — the operator never leaves the keyboard. */
$('#sbSearch').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (SB.filtered.length !== 1) return;
  var slab = SB.filtered[0];
  if (!sbHas(slab)) { buzz(); sbToggle(slab, true, $('#sbList').querySelector('.sg-row')); }
  this.value = ''; SB.q = '';
  $('#sbClear').classList.remove('on');
  sbFilter();
});

$('#sbClear').onclick = function () {
  $('#sbSearch').value = ''; SB.q = '';
  this.classList.remove('on');
  sbFilter();
  $('#sbSearch').focus();
};
$('#sbClose').onclick = closeTop;
$('#sbDone').onclick = closeTop;

/* ------------------------------------------ dispatch candidate list ----- */
/*
 * Four thousand slabs and their QC grades, fetched once when the form opens
 * rather than inlined into the form payload — the form paints immediately and
 * the list fills in a moment later.
 */
var SG = { opts: [], qc: {}, loading: false };

function loadDispatchSlabs(force) {
  var fld = null;
  S.form.sections.forEach(function (s) {
    s.fields.forEach(function (f) { if (f.type === 'slabgrade') fld = f; });
  });
  if (!fld) return;
  if (SG.opts.length && !force) { redrawSlabGrade(); return; }

  SG.loading = true;
  redrawSlabGrade();
  gs('api_dispatchSlabs', S.token).then(function (r) {
    SG.loading = false;
    if (!r || !r.ok) { toast((r && r.error) || 'Could not load the slab list.', 'bad'); }
    SG.opts = (r && r.slabs) || [];
    SG.qc = {};
    ((r && r.grades) || []).forEach(function (g, i) { if (g) SG.qc[SG.opts[i]] = g; });
    redrawSlabGrade();
    updateSummary();
  }, function (e) { SG.loading = false; redrawSlabGrade(); fail(e); });
}

function redrawSlabGrade() {
  var n = document.querySelector('.sglist');
  if (n && n._redraw) n._redraw();
}

/* ================================================ trolley bundle slabs == */
function loadBundleSlabs(bundle) {
  var fld = null;
  S.form.sections.forEach(function (s) {
    s.fields.forEach(function (f) { if (f.dynamic) fld = f; });
  });
  if (!fld) return;
  S.opts[fld.id] = [];
  delete S.values[fld.id];
  var ck = S.nodes[fld.id] && S.nodes[fld.id].querySelector('.checklist');
  if (ck) ck._redraw();
  if (!bundle) { updateSummary(); return; }
  if (ck) ck.querySelector('.ck-list').innerHTML =
    '<div class="ck-empty">Loading slabs…</div>';

  gs('api_bundleSlabs', S.token, bundle).then(function (slabs) {
    S.opts[fld.id] = slabs || [];
    if (ck) ck._redraw();
    if (!slabs || !slabs.length) toast('No slabs listed for ' + bundle + '.', 'bad');
    updateSummary();
  }).catch(fail);
}

/* ===================================================== bag invoice ====== */
/*
 * The tick list of bags. It is fetched per material + supplier, because
 * that pair is the whole filter: the server sends only Bag Form bags of that
 * material and supplier that are on no invoice yet, with each bag's weight.
 *
 * Value shape: values.bags = ['4970', '4971', ...] — numbers only. The
 * weights stay here in BI.w for the live total; the server reads its own
 * from the Bag Form when it saves.
 */
var BI = { bags: [], w: {}, loading: false, sig: '' };

function bagField() {
  var out = null;
  if (S.form) S.form.sections.forEach(function (s) {
    s.fields.forEach(function (f) { if (f.type === 'bagpick') out = f; });
  });
  return out;
}

/** "12,840 kg" — Indian grouping, at most two decimals. */
function kg(n) {
  return (Math.round(Number(n) * 100) / 100).toLocaleString('en-IN') + ' kg';
}

/**
 * keep = false: the material or supplier changed, so the old ticks are for
 * other bags and go. keep = true: a draft, a refresh or a refused save — the
 * ticks stay wherever the bag is still offered.
 */
function loadInvoiceBags(keep) {
  var f = bagField();
  if (!f) return;
  var on = f.dependsOn || [];
  var mat = S.values[on[0]] || '', sup = S.values[on[1]] || '';
  var sig = mat + '|' + sup;
  /* Picking the same supplier again is not a change: do not wipe the ticks. */
  if (!keep && sig === BI.sig) return;
  BI.sig = sig;
  if (!keep) delete S.values[f.id];
  BI.bags = []; BI.w = {};
  if (!mat || !sup) { BI.loading = false; redrawBagPick(); updateSummary(); return; }

  BI.loading = true;
  redrawBagPick();
  gs('api_invoiceBags', S.token, mat, sup).then(function (r) {
    if (BI.sig !== sig) return;                 // the answer to an older choice
    BI.loading = false;
    if (!r || !r.ok) toast((r && r.error) || 'Could not load the bags.', 'bad');
    BI.bags = ((r && r.bags) || []).map(String);
    ((r && r.weights) || []).forEach(function (w, i) { BI.w[BI.bags[i]] = w; });
    var cur = S.values[f.id] || [];
    var kept = cur.filter(function (b) { return BI.w[b] !== undefined; });
    if (kept.length !== cur.length) {
      if (kept.length) S.values[f.id] = kept; else delete S.values[f.id];
      toast((cur.length - kept.length) + ' ticked bag' + (cur.length - kept.length === 1 ? ' is' : 's are') +
            ' no longer free and ' + (cur.length - kept.length === 1 ? 'was' : 'were') + ' unticked.', 'bad');
    }
    redrawBagPick();
    updateSummary();
  }, function (e) {
    if (BI.sig !== sig) return;
    BI.loading = false; redrawBagPick(); fail(e);
  });
}

function redrawBagPick() {
  var f = bagField();
  var n = f && S.nodes[f.id] && S.nodes[f.id].querySelector('[data-ctl="bagpick"]');
  if (n && n._redraw) n._redraw();
}

/* --- the list itself: a checklist like buildMulti, with each bag's weight --- */
function buildBagPick(f) {
  var wrap = el('div', 'checklist baglist');
  wrap.dataset.ctl = 'bagpick';

  var searchRow = el('div', 'ck-search');
  var search = el('input');
  search.type = 'text';
  search.placeholder = 'Search bag number…';
  search.inputMode = 'numeric';
  search.autocomplete = 'off';
  search.id = 'f_' + f.id;
  searchRow.appendChild(search);
  var list = el('div', 'ck-list');
  var foot = el('div', 'ck-foot');
  var cnt = el('span', 'ck-cnt');
  var allBtn = el('button', 'link');
  allBtn.type = 'button';
  foot.appendChild(cnt);
  foot.appendChild(allBtn);
  wrap.appendChild(searchRow);
  wrap.appendChild(list);
  wrap.appendChild(foot);

  var expanded = false;
  var CAP = 150;                      // the list scrolls inside itself

  function sel() { return S.values[f.id] || []; }
  function shown() {
    var q = search.value.trim();
    return q ? BI.bags.filter(function (b) { return b.indexOf(q) !== -1; }) : BI.bags;
  }
  function paintFoot() {
    var all = BI.bags, sh = shown(), s = sel();
    cnt.textContent = all.length ? s.length + ' of ' + all.length + ' ticked' : '';
    var allOn = sh.length && sh.every(function (b) { return s.indexOf(b) !== -1; });
    var filtered = sh.length !== all.length;
    allBtn.textContent = (allOn ? 'Clear ' : 'Select ') + (filtered ? 'shown' : 'all');
    allBtn.style.display = sh.length > 1 ? '' : 'none';
  }

  function draw() {
    var all = BI.bags, q = search.value.trim(), sh = shown();
    searchRow.style.display = all.length > 12 ? '' : 'none';
    list.innerHTML = '';
    var need = (f.dependsOn || []).map(fieldById).filter(function (x) { return x && !S.values[x.id]; });
    if (need.length) {
      list.appendChild(el('div', 'ck-empty',
        'Choose ' + need.map(function (x) { return x.label; }).join(' and ') + ' first.'));
    } else if (BI.loading) {
      list.appendChild(el('div', 'ck-empty', 'Loading bags…'));
    } else if (!all.length) {
      list.appendChild(el('div', 'ck-empty', 'No ' + S.values[(f.dependsOn || [])[1]] +
        ' bags are waiting for an invoice. Bags appear here once they are on the Bag Form.'));
    } else if (!sh.length) {
      list.appendChild(el('div', 'ck-empty', 'No bag number contains “' + q + '”'));
    } else {
      var cut = (!expanded && !q && sh.length > CAP) ? CAP : sh.length;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < cut; i++) {
        var b = sh[i], on = sel().indexOf(b) !== -1;
        var row = el('label', 'chk' + (on ? ' on' : ''));
        var box = el('input');
        box.type = 'checkbox';
        box.checked = on;
        box.value = b;
        row.appendChild(box);
        var t = el('span', 'chk-t');
        t.innerHTML = highlight(b, q);
        row.appendChild(t);
        row.appendChild(el('span', 'bw', kg(BI.w[b])));
        frag.appendChild(row);
      }
      list.appendChild(frag);
      if (cut < sh.length) {
        var more = el('button', 'ck-more', 'Show all ' + sh.length);
        more.type = 'button';
        more.onclick = function () { expanded = true; draw(); };
        list.appendChild(more);
      }
    }
    paintFoot();
    drawBagTotals();
  }

  list.addEventListener('change', function (e) {
    var box = e.target;
    if (!box || box.type !== 'checkbox') return;
    var cur = sel().slice();
    var i = cur.indexOf(box.value);
    if (box.checked && i < 0) cur.push(box.value);
    if (!box.checked && i >= 0) cur.splice(i, 1);
    box.closest('.chk').classList.toggle('on', box.checked);
    buzz();
    setVal(f, cur);
    paintFoot();
    drawBagTotals();
  });
  /* Like a sheet filter: with a search typed, it acts on what is shown. */
  allBtn.onclick = function () {
    var sh = shown(), cur = sel().slice();
    var allOn = sh.every(function (b) { return cur.indexOf(b) !== -1; });
    if (allOn) cur = cur.filter(function (b) { return sh.indexOf(b) === -1; });
    else sh.forEach(function (b) { if (cur.indexOf(b) === -1) cur.push(b); });
    setVal(f, cur);
    draw();
  };
  search.addEventListener('input', draw);

  wrap._redraw = draw;
  wrap._set = function (v) {
    if (v && v.length) S.values[f.id] = v; else delete S.values[f.id];
    draw();
  };
  draw();
  return wrap;
}

function bagTotal() {
  var f = bagField();
  var t = 0, n = 0;
  if (f) (S.values[f.id] || []).forEach(function (b) { t += Number(BI.w[b]) || 0; n++; });
  return { n: n, total: Math.round(t * 100) / 100 };
}

/** {total, inv, diff} when the ticked bags outweigh the invoice, else null. */
function bagOver() {
  var f = bagField();
  if (!f) return null;
  var t = bagTotal(), inv = parseFloat(S.values[f.weightOf]);
  if (!t.n || isNaN(inv)) return null;
  var d = Math.round((t.total - inv) * 100) / 100;
  return d > 0 ? { total: t.total, inv: inv, diff: d } : null;
}

/** The total beside the question, and the line under the list. */
function drawBagTotals() {
  var f = bagField();
  if (!f || !S.nodes[f.id]) return;
  var box = S.nodes[f.id];
  var lab = box.querySelector('.lab-total'), warn = box.querySelector('.bagwarn');
  var t = bagTotal(), inv = parseFloat(S.values[f.weightOf]), over = bagOver();
  if (lab) {
    lab.textContent = t.n ? 'Total ' + kg(t.total) + ' · ' + t.n + ' bag' + (t.n === 1 ? '' : 's') : '';
    lab.classList.toggle('over', !!over);
  }
  if (!warn) return;
  if (over) {
    warn.className = 'bagwarn over';
    warn.textContent = '⚠ The ticked bags weigh ' + kg(over.total) + ' — ' + kg(over.diff) +
                       ' more than the invoice weight (' + kg(over.inv) + ').';
  } else if (t.n && !isNaN(inv)) {
    var left = Math.round((inv - t.total) * 100) / 100;
    warn.className = 'bagwarn ok';
    warn.textContent = left === 0 ? '✓ Exactly the invoice weight.'
      : kg(left) + ' below the invoice weight of ' + kg(inv) + '.';
  } else {
    warn.className = 'bagwarn';
    warn.textContent = '';
  }
}

function bagSummaryText() {
  var t = bagTotal();
  return t.n + ' bag' + (t.n === 1 ? '' : 's') + ' — ' + kg(t.total);
}

/* ============================================ bag form: used numbers ==== */
/*
 * The Bag Form refuses a Material + Bag Number that is already on its tab —
 * the server guard (FDUP_KEYS.bag) always has. This tells the operator the
 * moment the number is typed instead of after Submit: the box turns red,
 * says where the bag already is, and Submit stays shut until it is changed.
 *
 * The list is fetched once per form load. If it cannot be fetched, nothing
 * here blocks, and the server guard still refuses the repeat on Submit.
 */
var BU = { used: null, hit: '' };

function usedField() {
  var out = null;
  if (S.form) S.form.sections.forEach(function (s) {
    s.fields.forEach(function (f) { if (f.uniqueLive) out = f; });
  });
  return out;
}

function loadUsedBags() {
  gs('api_usedBags', S.token).then(function (r) {
    if (!r || !r.ok) { if (r && r.error) toast(r.error, 'bad'); return; }
    BU.used = r.used || {};
    checkUsedBag();
  }, function () { /* offline: the server guard still decides on Submit */ });
}

/* Same rule as the server's fDupNorm_: case and spacing never make two bags.
   A bag is unique within its MATERIAL — Grit 101 and Filler 101 are two bags. */
function bagKeyJs(material, bag) {
  function n(v) { return String(v == null ? '' : v).trim().toUpperCase().replace(/\s+/g, ''); }
  return n(material) + '|' + n(bag);
}

function checkUsedBag() {
  var f = usedField();
  if (!f || !S.nodes[f.id]) return;
  var box = S.nodes[f.id], note = box.querySelector('.dupnote');
  var v = S.values[f.id], m = S.values.material;
  var info = (BU.used && v && m) ? BU.used[bagKeyJs(m, v)] : undefined;
  var was = BU.hit;
  BU.hit = info !== undefined ? (info || 'already recorded') : '';
  box.classList.toggle('invalid', !!BU.hit);
  if (note) {
    note.textContent = BU.hit
      ? m + ' bag ' + v + ' is already on the Bag Form (' + BU.hit + '). Use another number.'
      : '';
    note.classList.toggle('on', !!BU.hit);
  }
  if (was !== BU.hit) updateSummary();
}

/* ============================ prefill confirmation (one per section) ==== */
/* Carried-over values are the easy way to record the previous slab's numbers
   against this one. Every section that received them must be ticked before
   the entry can be submitted. */
function renderConfirms() {
  var want = [];
  S.form.sections.forEach(function (sec, si) {
    if (!condOK(sec.showWhen)) return;
    var any = sec.fields.some(function (f) {
      return S.prefilled[f.id] && condOK(f.showWhen);
    });
    if (any) want.push(si);
  });

  var sig = want.join(',');
  if (sig === S.confirmSecs.join(',') && document.querySelector('.confirmbox')) {
    S.confirmSecs = want;
    return;                                   // nothing structural changed
  }
  S.confirmSecs = want;

  document.querySelectorAll('.confirmbox').forEach(function (n) { n.remove(); });
  want.forEach(function (si) {
    var box = document.querySelector('.sec[data-sec="' + si + '"]');
    if (!box) return;
    var lab = el('label', 'confirmbox' + (S.confirmed[si] ? ' ok' : ''));
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = !!S.confirmed[si];
    cb.onchange = function () {
      S.confirmed[si] = cb.checked;
      lab.classList.toggle('ok', cb.checked);
      buzz();
      updateSummary();
    };
    lab.appendChild(cb);
    lab.appendChild(el('span', null,
      'I have checked the carried-over values in this section against this slab'));
    box.appendChild(lab);
  });
}

function missingConfirms() {
  return S.confirmSecs.filter(function (si) { return !S.confirmed[si]; });
}

/* ======================================================== visibility ==== */
function condOK(c) {
  if (!c) return true;
  var v = S.values[c.field];
  if (c['in']) return c['in'].indexOf(v) !== -1;
  return v === c.eq;
}
function applyVisibility() {
  var n = 0;
  S.form.sections.forEach(function (sec, si) {
    var box = document.querySelector('.sec[data-sec="' + si + '"]');
    if (!box) return;
    var secOK = condOK(sec.showWhen);
    var wasHidden = box.style.display === 'none';
    box.style.display = secOK ? '' : 'none';
    if (secOK && wasHidden) {
      box.classList.add('revealed');
      setTimeout(function () { box.classList.remove('revealed'); }, 500);
    }
    var vis = 0, filled = 0;
    sec.fields.forEach(function (f) {
      var fb = S.nodes[f.id];
      if (!fb) return;
      var ok = secOK && condOK(f.showWhen);
      fb.style.display = ok ? '' : 'none';
      if (!ok) return;
      vis++;
      var v = S.values[f.id];
      if (!(v === undefined || v === '' || (Array.isArray(v) && !v.length))) filled++;
    });
    if (secOK && !vis) box.style.display = 'none';
    if (box.style.display !== 'none') {
      n++;
      box.querySelector('.sec-h .n').textContent = String(n);
      box.classList.toggle('done', vis > 0 && filled === vis);
    }
  });
  if (Object.keys(S.prefilled).length) renderConfirms();
}
function activeFields() {
  var out = [];
  S.form.sections.forEach(function (sec) {
    if (!condOK(sec.showWhen)) return;
    sec.fields.forEach(function (f) { if (condOK(f.showWhen)) out.push(f); });
  });
  return out;
}
/**
 * Slabs that are in the container but carry no grade. The server refuses these
 * too, but catching them here means the operator is scrolled to the offending
 * row instead of reading a list of slab numbers in a toast.
 */
function missingGrades() {
  var out = [];
  activeFields().forEach(function (f) {
    if (f.type !== 'slabgrade') return;
    (S.values[f.id] || []).forEach(function (r) {
      if (r && r.slab && !r.grade) out.push(r.slab);
    });
  });
  return out;
}

function missingRequired() {
  return activeFields().filter(function (f) {
    if (!f.required) return false;
    /* "Sections" stops being required once Full Slab is ticked — the report
       still describes somewhere, just not a numbered part. */
    if (f.requiredUnless && S.values[f.requiredUnless]) return false;
    var v = S.values[f.id];
    return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
  });
}

/* =========================================================== summary ==== */
/** How one field's value reads in the review panel. */
function summaryText(v) {
  if (v === true) return 'yes';
  if (v === false) return 'no';
  if (!Array.isArray(v)) return String(v);
  if (v.length && typeof v[0] === 'number') {
    return v.length === 1 ? 'section ' + v[0] : 'sections ' + v.join(', ');
  }
  if (v.length && v[0] && v[0].slab) {
    /* dispatch: "57 slabs — 41 A, 12 B, 4 C" is what an operator checks
       before submitting, far more than a list of 57 numbers would be */
    var by = {};
    v.forEach(function (x) { var g = x.grade || '(no grade)'; by[g] = (by[g] || 0) + 1; });
    var parts = Object.keys(by).sort().map(function (g) { return by[g] + ' ' + g; });
    return v.length + ' slab' + (v.length === 1 ? '' : 's') + ' — ' + parts.join(', ');
  }
  return v.length > 2 ? v.length + ' selected' : v.join(', ');
}

function updateSummary() {
  var af = activeFields(), filled = 0;
  var rowsD = document.createDocumentFragment(), rowsM = document.createDocumentFragment();

  af.forEach(function (f) {
    var v = S.values[f.id];
    var has = !(v === undefined || v === null || v === '' || v === false ||
                (Array.isArray(v) && !v.length));
    if (has) filled++;
    if (!has && !f.required) return;
    var txt = has ? (f.type === 'bagpick' ? bagSummaryText(v)
                   : f.type === 'photo' ? v.length + ' photo' + (v.length === 1 ? '' : 's')
                   : summaryText(v)) : 'still needed';
    if (f.uniqueLive && BU.hit) { has = false; txt = 'already used'; }
    [rowsD, rowsM].forEach(function (frag) {
      var r = el('button', 'srow' + (has ? '' : ' miss'));
      r.type = 'button';
      r.appendChild(el('span', 'sk', f.label));
      r.appendChild(el('span', 'sv', txt));
      r.onclick = function () {
        if (openSheets.length) closeTop();
        setTimeout(function () {
          var n = S.nodes[f.id];
          if (!n) return;
          n.scrollIntoView({ behavior: 'smooth', block: 'center' });
          var i = n.querySelector('input.input,textarea.input');
          if (i && !isPhone()) setTimeout(function () { i.focus(); }, 300);
        }, openSheets.length ? 260 : 0);
      };
      frag.appendChild(r);
    });
  });

  var miss = missingRequired().length + missingConfirms().length + missingGrades().length +
             missingSectionFields().length + missingUploads().length + (BU.hit ? 1 : 0);
  var sd = $('#summaryD'), sm = $('#summaryM');
  sd.innerHTML = ''; sm.innerHTML = '';
  if (!af.length) { sd.appendChild(el('div', 'empty', '—')); }
  sd.appendChild(rowsD);
  var head = el('div', 'rvhead');
  head.appendChild(el('span', null, filled + ' of ' + af.length + ' filled'));
  head.appendChild(el('span', null, miss ? miss + ' required left' : 'ready to submit'));
  head.lastChild.style.color = miss ? 'var(--danger)' : 'var(--ok)';
  sm.appendChild(head);
  sm.appendChild(rowsM);
  missingConfirms().forEach(function (si) {
    var r = el('button', 'srow miss');
    r.type = 'button';
    r.appendChild(el('span', 'sk', S.form.sections[si].title));
    r.appendChild(el('span', 'sv', 'confirm carried values'));
    r.onclick = function () {
      if (openSheets.length) closeTop();
      setTimeout(function () {
        var box = document.querySelector('.sec[data-sec="' + si + '"] .confirmbox');
        box && box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, openSheets.length ? 260 : 0);
    };
    sm.appendChild(r);
  });
  if (!filled) sm.appendChild(el('div', 'empty', 'Nothing filled in yet.'));

  var pct = af.length ? Math.round(filled / af.length * 100) : 0;
  $('#progBar').style.width = pct + '%';
  $('#barProg').style.width = pct + '%';
  $('#progText').textContent = filled + ' of ' + af.length + ' filled';
  $('#reqText').textContent = miss ? miss + ' required left' : 'ready';
  $('#reqText').style.color = miss ? 'var(--danger)' : 'var(--ok)';
  $('#reviewCount').textContent = miss ? String(miss) : String(filled);
  $('#reviewLbl').textContent = miss ? 'to fill' : 'filled';
  $('#reviewBtn').classList.toggle('missing', !!miss);

  /* keep the entry's identity visible in the top bar while scrolling —
     the slab, the bundle, or whatever the form nominates */
  var keyVal = S.values.slab || S.values.slabA || S.values.slabB || S.values.bundle ||
               (S.form.keyField ? (S.values[S.form.keyField] || '') : '') || '';
  $('#barCtx').textContent = keyVal || (S.forms.length > 1 ? 'tap to switch form' : '');
}

/* ============================================================ menu ====== */
$('#formSwitch').onclick = function () { if (S.forms.length > 1) sheetOpen('#formSheet'); };
$('#menuBtn').onclick = function () { sheetOpen('#menuSheet'); };
$('#reviewBtn').onclick = function () { sheetOpen('#review'); };
$('#rvSubmit').onclick = function () { closeTop(); setTimeout(doSubmit, 260); };

/** `which` is the button that was pressed: #prefillBtn, #prefillA or #prefillB. */
function pfBusy(on, msg, which) {
  var b = $(which || '#prefillBtn');
  /* Both line buttons go dead together — two lookups at once would race each
     other into the same fields. */
  ['#prefillBtn', '#prefillA', '#prefillB'].forEach(function (sel) {
    var n = $(sel);
    if (n) n.disabled = on;
  });
  var ic = b && b.querySelector('.pf-ic');
  if (ic) ic.innerHTML = on ? '<span class="spinner"></span>' : '\u21BB';
  if (msg) pfSay(msg, which);
}

/** Where the running commentary goes: under the one button, or under the pair. */
function pfSay(msg, which) {
  if (S.form && S.form.prefillLines) { $('#prefillNote').textContent = msg; return; }
  $('#prefillSub').textContent = msg;
}

/**
 * `line` is '' on forms with one button, or 'A'/'B' on Batching and Resin.
 * Those two run a different recipe per line, so the lookup has to be per line
 * as well — see api_previousValues.
 */
function fillPrevious(line) {
  var which = line === 'A' ? '#prefillA' : line === 'B' ? '#prefillB' : '#prefillBtn';
  pfBusy(true, line ? 'Looking up your last ' + line + ' line entry…'
                    : 'Looking up your last entry…', which);

  gs('api_previousValues', S.token, S.form.key, line || '').then(function (r) {
    pfBusy(false, '', which);
    if (!r.ok) { pfSay(r.error, which); toast(r.error, 'bad'); return; }

    var n = 0;
    S.prefilled = {}; S.confirmed = {}; S.confirmSecs = [];
    Object.keys(r.values).forEach(function (id) {
      if (!S.nodes[id]) return;
      applyToControl(id, r.values[id]);
      S.prefilled[id] = true;
      n++;
      var node = S.nodes[id];
      node.classList.add('flash');
      setTimeout(function () { node.classList.remove('flash'); }, 1600);
    });

    /* Batching's Line radio is set from the button, not carried over — the
       operator chose it by which one they pressed — so it is applied without
       being marked prefilled, and does not drag a confirmation tick onto a
       section whose slab is still blank. */
    if (r.lineField && S.nodes[r.lineField]) {
      applyToControl(r.lineField, r.line);   // sets the pill and S.values both
    }

    applyVisibility(); renderConfirms(); updateSummary(); buzz(12);
    document.querySelectorAll('.prefill').forEach(function (b) { b.classList.remove('used'); });
    $(which).classList.add('used');

    var msg = 'Filled ' + n + ' field' + (n === 1 ? '' : 's') +
      (line ? ' from the last ' + line + ' line entry' : '') +
      (r.when ? (line ? ' (' + r.when + ')' : ' from your entry on ' + r.when) : '') +
      ' — tap again to redo';
    pfSay(msg, which);
    toast('Filled ' + n + ' field' + (n === 1 ? '' : 's') +
          '. Slab number left blank.', 'good');
  }).catch(function (e) { pfBusy(false, '', which); fail(e); });
}

/**
 * Put a saved entry back on the page.
 *
 * applyToControl only knows how to fill a CONTROL, and returns immediately for
 * a key that has no control. Two of Grade Reporting's most important keys have
 * none: `sec`, which holds every section's photos, defects, reason and
 * solution, and `alertId`, which ties the report to the alert it answers. Both
 * were therefore dropped on every restore — the slab came back, the section
 * came back, and the block underneath was empty. On a phone that is the whole
 * report gone, because Android reloads the tab while the camera is open.
 *
 * The bags go in FIRST: filling the `sections` control renders the blocks, and
 * the blocks read their values out of the bags as they are built.
 */
function restoreValues(vals, announce) {
  var ids = Object.keys(vals);
  var plain = ids.filter(function (id) { return !S.nodes[id]; });
  var fields = ids.filter(function (id) { return !!S.nodes[id]; });

  plain.forEach(function (id) { S.values[id] = vals[id]; });
  var lost = S.form && (S.form.multiSection || photoFields().length) ? pruneLostMedia() : 0;
  fields.forEach(function (id) { applyToControl(id, vals[id]); });
  /* The photo fields' links are re-derived from what actually survived. */
  photoFields().forEach(function (f) {
    syncPhotoField(photoBagKey(f.id));
    var c = S.nodes[f.id] && S.nodes[f.id].querySelector('[data-ctl="photo"]');
    if (c && c._paint) c._paint();
  });
  /* applyToControl writes the value without going through setVal, so the live
     notes under the boxes would keep showing the last thing typed. */
  refreshCalcNotes();

  if (!announce) return;
  if (lost) {
    toast('Restored your entry — but ' + lost + ' photo' + (lost === 1 ? '' : 's') +
          ' had not finished uploading and must be taken again.', 'bad');
  } else {
    toast('Restored your unsaved entry.', 'good');
  }
}

/**
 * A photo that had not reached Drive before the page went away cannot be
 * recovered: the file lived in this tab's memory and the tab is gone. Keeping
 * a dead record would block the form with a Retry that cannot work, so they
 * are dropped and counted, and the operator is told to take them again.
 */
function pruneLostMedia() {
  var bags = S.values.sec || {};
  var lost = 0;
  Object.keys(bags).forEach(function (k) {
    var d = bags[k];
    if (!d) return;
    ['photos', 'videos'].forEach(function (which) {
      var arr = d[which];
      if (!Array.isArray(arr)) { d[which] = []; return; }
      d[which] = arr.filter(function (m) {
        var keep = m && m.state === 'ok' && m.url;
        if (!keep) lost++;
        return keep;
      });
    });
    d.defects = Array.isArray(d.defects) ? d.defects : [];
  });
  return lost;
}

function applyToControl(id, v) {
  var box = S.nodes[id];
  if (!box) return;
  S.values[id] = v;
  var ctl = box.querySelector('[data-ctl]');
  var kind = ctl && ctl.dataset.ctl;
  if (kind === 'pills') {
    [].forEach.call(ctl.children, function (c) { c.classList.toggle('on', c.textContent === v); });
  } else if (kind === 'pick') {
    ctl._set(v);
  } else if (kind === 'multi') {
    if (!Array.isArray(v)) S.values[id] = v = String(v).split(/\s*,\s*/).filter(String);
    ctl._set(v);
  } else if (kind === 'toggle') {
    ctl._set(!!v);
  } else if (kind === 'photo') {
    if (ctl._paint) ctl._paint();
  } else if (kind === 'slabmap') {
    ctl._set(Array.isArray(v) ? v : []);
  } else if (kind === 'bagpick') {
    ctl._set(Array.isArray(v) ? v.map(String) : []);
  } else if (kind === 'slabgrade') {
    /* A restored draft can predate a grade being added, so anything that is
       not a {slab, grade} pair is dropped rather than written as a blank. */
    ctl._set((Array.isArray(v) ? v : []).filter(function (x) { return x && x.slab; }));
  } else {
    var i = box.querySelector('.input');
    if (!i) return;
    /* Fill previous values and a restored draft both land here. An old entry
       may hold something this field would no longer accept — a bag number
       recorded as "B-4471" before the rule existed — and writing it in would
       leave the operator staring at a value the server is about to refuse. */
    var fd = fieldById(id);
    if (fd && fd.type === 'number') {
      var cleaned = numClean(fd, v);
      S.values[id] = cleaned;
      i.value = cleaned;
      return;
    }
    i.value = v;
  }
}

/* ========================================================= oven timer ==== */
/* Oven In records a slab, its shelf and an estimated curing time; Oven Out
   ends it. Between the two this counts down, and once a slab passes its
   estimate the banner turns red and stays on screen on EVERY form until the
   Oven Out entry is made. Overcooked material is expensive. */
var OV = { items: [], skew: 0, enabled: false, stale: 0, noEst: [], timer: null, poll: null };

function ovenStart() {
  ovenFetch();
  clearInterval(OV.timer); clearInterval(OV.poll);
  OV.timer = setInterval(ovenRender, 1000);           // the countdown itself
  OV.poll  = setInterval(ovenFetch, 45000);           // fresh data from the sheet
}

function ovenFetch() {
  if (!S.token) return;
  gs('api_ovenStatus', S.token).then(function (r) {
    if (!r || !r.ok) return;
    /* Not an oven user: the answer will be "nothing" every time, and each ask
       is a server execution competing with everybody's saves. Stop asking. */
    if (!r.enabled) { clearInterval(OV.poll); OV.poll = null; }
    OV.enabled = !!r.enabled;
    OV.items = r.items || [];
    OV.stale = r.stale || 0;
    OV.noEst = r.noEst || [];
    /* trust the server's clock, not the phone's — a tablet with a wrong time
       would otherwise show every slab as hours overdue */
    OV.skew = (r.now || Date.now()) - Date.now();
    ovenRender();
  }).catch(function () {});
}

function ovenNow() { return Date.now() + OV.skew; }

function fmtDur(msLeft) {
  var t = Math.max(0, Math.round(Math.abs(msLeft) / 1000));
  var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return h ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}

var OV_OPEN = false;

function ovenRender() {
  var dock = $('#ovenDock');
  if (!OV.enabled || (!OV.items.length && !OV.stale && !OV.noEst.length)) {
    dock.innerHTML = '';
    setOvenHeight();
    return;
  }

  var now = ovenNow();
  var late = [], curing = [];
  OV.items.forEach(function (it) { (now >= it.dueMs ? late : curing).push(it); });

  /* Redrawing the whole strip every second would fight the operator's finger
     and reset the scroll inside it, so only the clocks are rewritten unless
     the shape of the thing has actually changed. */
  var sig = late.map(function (i) { return i.slab; }).join(',') + '|' +
            curing.map(function (i) { return i.slab; }).join(',') + '|' +
            OV.noEst.map(function (i) { return i.slab; }).join(',') + '|' +
            OV.stale + '|' + (OV_OPEN ? 1 : 0);

  if (dock.dataset.sig === sig) { ovenTick(now, late, curing); return; }
  dock.dataset.sig = sig;

  dock.innerHTML = '';
  var box = el('div', 'odock' + (late.length ? ' late' : '') + (OV_OPEN ? ' open' : ''));

  /* --- the one collapsed line --- */
  var head = el('button', 'od-head');
  head.type = 'button';
  if (late.length) head.appendChild(el('span', 'od-dot'));
  var lead;
  if (late.length) {
    lead = late.length === 1 ? '1 slab past its curing time'
                             : late.length + ' slabs past their curing time';
  } else if (curing.length) {
    lead = curing.length + (curing.length === 1 ? ' slab curing' : ' slabs curing');
  } else {
    lead = OV.noEst.length + (OV.noEst.length === 1 ? ' slab in the oven' : ' slabs in the oven') +
           ' — no curing time entered';
  }
  head.appendChild(el('span', 'od-lead', lead));

  var peek = el('div', 'od-peek');
  var first = late.length ? late[0] : curing[0];
  if (first) {
    peek.appendChild(el('span', 'slab', first.slab));
    peek.appendChild(el('span', 'clock', ''));
  }
  peek.appendChild(el('span', 'od-chev'));
  head.appendChild(peek);
  head.onclick = function () {
    OV_OPEN = !OV_OPEN;
    box.classList.toggle('open', OV_OPEN);
    dock.dataset.sig = '';               // force a rebuild on the next tick
    buzz();
    setOvenHeight();
  };
  box.appendChild(head);

  /* --- the expanded list --- */
  var body = el('div', 'od-body');
  late.forEach(function (it) { body.appendChild(ovenRow(it, true)); });
  curing.forEach(function (it) { body.appendChild(ovenRow(it, false)); });

  /* In the oven but nothing to count down to — worth seeing, not hiding. */
  OV.noEst.forEach(function (it) {
    var r = el('div', 'od-row');
    r.appendChild(el('span', 's', it.slab));
    if (it.shelf) r.appendChild(el('span', 'sh', 'Shelf ' + it.shelf));
    var t = el('span', 't');
    t.appendChild(el('i', null, 'no time set'));
    r.appendChild(t);
    body.appendChild(r);
  });

  if (OV.stale) {
    body.appendChild(el('div', 'od-sub', OV.stale + ' slab' + (OV.stale === 1 ? '' : 's') +
      ' logged in over a day ago with no Oven Out entry — not counted here, ' +
      'tell your supervisor so the record can be closed.'));
  }
  box.appendChild(body);

  dock.appendChild(box);
  ovenTick(now, late, curing);
  setOvenHeight();
}

function ovenRow(it, over) {
  var r = el('div', 'od-row ' + (over ? 'over' : 'left'));
  r.dataset.slab = it.slab;
  r.appendChild(el('span', 's', it.slab));
  if (it.shelf) r.appendChild(el('span', 'sh', 'Shelf ' + it.shelf));
  var t = el('span', 't');
  t.appendChild(el('span', 'v', ''));
  t.appendChild(el('i', null, over ? 'over' : 'left'));
  r.appendChild(t);
  return r;
}

/** Only the numbers change on a tick — never the layout. */
function ovenTick(now, late, curing) {
  var lead = late.length ? late[0] : curing[0];
  var clock = document.querySelector('#ovenDock .od-peek .clock');
  if (clock && lead) {
    clock.textContent = fmtDur(late.length ? now - lead.dueMs : lead.dueMs - now);
  }
  late.concat(curing).forEach(function (it) {
    var cell = document.querySelector('#ovenDock .od-row[data-slab="' +
      it.slab.replace(/"/g, '') + '"] .t .v');
    if (cell) cell.textContent = fmtDur(now >= it.dueMs ? now - it.dueMs : it.dueMs - now);
  });
}

  var rows = !q ? HX.entries : HX.entries.filter(function (e) {
    if ((e.key || '').toLowerCase().indexOf(q) !== -1) return true;
    if ((e.who || '').toLowerCase().indexOf(q) !== -1) return true;

    }
    return false;
  });

    list.appendChild(el('div', 'ck-empty',
      HX.entries.length ? 'Nothing matches “' + HX.q + '”' : 'No entries on this form yet.'));

}

/* ============================================================ submit ==== */
function doSubmit() {
  var unconfirmed = missingConfirms();
  if (unconfirmed.length) {
    var first = document.querySelector('.sec[data-sec="' + unconfirmed[0] + '"] .confirmbox');
    if (first) {
      first.classList.add('shake');
      setTimeout(function () { first.classList.remove('shake'); }, 700);
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    buzz([20, 60, 20]);
    toast('Confirm the carried-over values in ' +
      (unconfirmed.length === 1 ? '“' + S.form.sections[unconfirmed[0]].title + '”'
                                : unconfirmed.length + ' sections') + ' first.', 'bad');
    return;
  }
  var badSec = missingSectionFields();
  if (badSec.length) {
    var first = badSec[0];
    var node = S.secNodes[first.n + '.' + first.id];
    if (node) {
      node.classList.add('invalid');
      setTimeout(function () { node.classList.remove('invalid'); }, 1800);
      node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    buzz([20, 60, 20]);
    toast(secTitle(first.n) + ' still needs ' + first.what +
          (badSec.length > 1 ? ' (' + badSec.length + ' things left)' : '') + '.', 'bad');
    return;
  }
  var up = missingUploads();
  if (up.length) {
    var un0 = S.nodes[up[0].f.id];
    if (un0) {
      un0.classList.add('invalid');
      setTimeout(function () { un0.classList.remove('invalid'); }, 1800);
      un0.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    buzz([20, 60, 20]);
    toast(up[0].f.label + ': waiting for ' + up[0].what + '.', 'bad');
    return;
  }
  var noGrade = missingGrades();
  if (noGrade.length) {
    var row = document.querySelector('.sg-sel .sg-row.nograde');
    if (row) {
      row.classList.add('shake');
      setTimeout(function () { row.classList.remove('shake'); }, 700);
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    buzz([20, 60, 20]);
    toast(noGrade.length === 1
      ? 'Set a grade for ' + noGrade[0] + ' before submitting.'
      : noGrade.length + ' slabs still need a grade — starting with ' + noGrade[0] + '.', 'bad');
    return;
  }
  var miss = missingRequired();
  if (miss.length) {
    miss.forEach(function (f) { S.nodes[f.id] && S.nodes[f.id].classList.add('invalid'); });
    buzz([20, 60, 20]);
    toast(miss.length + ' still needed — starting with ' + miss[0].label + '.', 'bad');
    S.nodes[miss[0].id].scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  /* Bag Form: a bag number already on the tab never leaves the phone. */
  var uf = usedField();
  if (uf && BU.hit) {
    var un = S.nodes[uf.id];
    un.classList.add('invalid');
    un.scrollIntoView({ behavior: 'smooth', block: 'center' });
    buzz([20, 60, 20]);
    toast(uf.label + ' ' + S.values[uf.id] + ' is already on the Bag Form — use another number.', 'bad');
    return;
  }
  /* Bag Invoice: heavier than the invoice is allowed, but only on purpose. */
  var over = bagOver();
  if (over && !confirm('The ticked bags weigh ' + kg(over.total) + ', which is ' + kg(over.diff) +
                       ' more than the invoice weight of ' + kg(over.inv) + '.\n\nSubmit anyway?')) {
    var bn = S.nodes[bagField().id];
    bn && bn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  var payload = JSON.parse(JSON.stringify(S.values));
  /* Only Grade Reporting reads the media bags; elsewhere the photo field
     already holds its Drive links, and the bags (thumbnails) are weight. */
  if (!S.form.multiSection) delete payload.sec;
  send(S.form.key, payload, true);
}
$('#submitBtn').onclick = doSubmit;
$('#submitBtnD').onclick = doSubmit;

function newId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function send(key, values, interactive, submitId) {
  var btns = [$('#submitBtn'), $('#submitBtnD')];
  if (interactive) btns.forEach(function (b) { busy(b, true, 'Saving'); });
  submitId = submitId || newId();
  /* Past twenty seconds, say so: a button that just spins looks hung, and a
     hung-looking button is the one that gets pressed again. */
  var slowT = interactive ? setTimeout(function () {
    btns.forEach(function (b) { if (b && b.disabled) busy(b, true, 'Still saving — please wait'); });
  }, 20000) : 0;

  /* Two handlers, not .then().catch(): with a single catch, an exception
     thrown while HANDLING a success is indistinguishable from the server
     never answering, and the app tells the operator "no connection" about an
     entry that is already saved. */
  gsWait(SUBMIT_TIMEOUT, 'api_submit', S.token, key, values, submitId).then(function (r) {
    clearTimeout(slowT);
    try { onSaved(r, key, values, btns); }
    catch (uiErr) {
      btns.forEach(function (b) { busy(b, false); });
      store(PEND_KEY, null);                    // it IS saved; do not queue it
      $('#pendingNote').className = 'alert err';
      toast('Saved — but the screen could not refresh: ' +
            String(uiErr && uiErr.message || uiErr), 'bad');
    }
  }, function (e) {
    clearTimeout(slowT);
    btns.forEach(function (b) { busy(b, false); });
    var msg = String(e && e.message || e || 'No connection');
    /* The entry is held with the SAME id, so a retry cannot produce a second
       row if the first attempt did in fact land. */
    store(PEND_KEY, { key: key, values: values, at: Date.now(), id: submitId });
    buzz([30, 80, 30]);
    /* A twelve-hour shift outlasts the session. Retrying against a dead token
       will fail forever, so send them to sign in — the queued entry survives
       the reload and goes up by itself once they are back. */
    if (/session expired/i.test(msg)) {
      toast('Your session expired — sign in again and this entry will be sent.', 'bad');
      store(TOKEN_KEY, null);
      setTimeout(function () { location.reload(); }, 1600);
      return;
    }
    showPending();
    toast(msg + ' — your entry is saved on this phone. Tap Retry.', 'bad');
  });
}

/**
 * Everything that happens once the server has confirmed the write. Kept out of
 * send() so that an exception in here is reported as what it is — a screen that
 * failed to refresh — and never as a lost connection for a saved entry.
 */
function onSaved(r, key, values, btns) {
  btns.forEach(function (b) { busy(b, false); });
  if (!r.ok) {
    /* A block is the server saying the entry is ALREADY in the sheet. Leaving
       it in the queue would park an entry that can never be sent behind a
       Retry button somebody taps all shift. */
    if (r.blocked) {
      store(PEND_KEY, null);
      $('#pendingNote').className = 'alert err';
      store(DRAFT_KEY, null);
      alertBox(r.error);
      buzz([30, 80, 30]);
      return;
    }
    toast(r.error, 'bad'); buzz(40);
    /* Some ticked bags went onto another invoice meanwhile: show the list as
       it is now, keeping the ticks that are still free. */
    if (r.refreshBags && bagField()) {
      var nb = $('#formNote');
      nb.textContent = r.error;
      nb.className = 'alert err show';
      loadInvoiceBags(true);
    }
    return;
  }
  store(PEND_KEY, null);
  $('#pendingNote').className = 'alert err';
  /* Held, not shown yet. loadForm below clears #formNote as part of resetting
     the page, so a note set here would flash and vanish — and the note is the
     only place the operator is told what the server did differently. */
  S.noteAfterLoad = r.note || '';
  buzz([15, 40, 15]);
  toast((r.duplicate ? 'Already saved' : 'Saved') + (r.key ? ' — ' + r.key : '') + '.', 'good');

  /* The form comes back completely empty. Carrying values over silently is
     how the previous slab's numbers end up recorded against the next one —
     if the operator wants them, Fill previous values is one tap away and
     makes them tick a box to say they checked. */
  store(DRAFT_KEY, null);
  /* Those slabs have left the candidate list, so the cached copy is wrong. */
  if (S.form && S.form.multiRow) { SG.opts = []; SG.qc = {}; }
  /* The empty form comes back at once from the copy this phone holds, with
     what was just saved taken out of its lists; the server's fresh lists
     follow a moment later (see loadForm). */
  loadForm(key, {}, null, (S.form && S.form.key === key) ? formWithout(S.base || S.form, values) : null);
  if (key === 'ovenIn' || key === 'ovenOut') setTimeout(ovenFetch, 400);
  $('#submitHint').textContent = 'Saved. Fill previous values if this entry repeats the last one.';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/**
 * A message that stays on the screen.
 *
 * A toast fades after a few seconds, which is right for "Saved" and wrong for
 * "this slab is already entered and here is where" — that one is read, thought
 * about, and acted on, so it stays until it is dismissed.
 */
function alertBox(text) {
  var box = $('#pendingNote');
  box.innerHTML = '';
  box.appendChild(el('b', null, 'Already entered. '));
  box.appendChild(document.createTextNode(text));
  var b = el('button', 'btn sm', 'OK');
  b.type = 'button';
  b.style.marginLeft = '8px';
  b.onclick = function () { box.className = 'alert err'; };
  box.appendChild(b);
  box.className = 'alert err show';
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showPending() {
  var p = load(PEND_KEY);
  var box = $('#pendingNote');
  if (!p) { box.className = 'alert err'; return; }
  box.innerHTML = '';
  box.appendChild(el('b', null, 'One entry is waiting to be sent. '));
  box.appendChild(document.createTextNode(
    (p.values.slab || p.values.slabA || p.values.slabB || p.values.bundle || '') + ' '));
  var b = el('button', 'btn sm', 'Retry now');
  b.type = 'button';
  b.style.marginLeft = '6px';
  b.onclick = function () { retryPending(true); };
  box.appendChild(b);
  /* Entries queued by a build before submit ids carry no id, so the server
     cannot recognise a repeat. Say so rather than let someone tap Retry on a
     row that is already in the sheet. */
  if (!p.id) {
    box.appendChild(el('i', 'pend-warn',
      ' Queued by an older version — check the sheet first; Retry could write it twice.'));
  }
  box.className = 'alert err show';
}
function retryPending(manual) {
  var p = load(PEND_KEY);
  if (!p) return;
  if (!manual) showPending();
  gsWait(SUBMIT_TIMEOUT, 'api_submit', S.token, p.key, p.values, p.id).then(function (r) {
    if (r && r.ok) {
      store(PEND_KEY, null);
      $('#pendingNote').className = 'alert err';
      toast(r.duplicate ? 'That entry had already been saved — no duplicate written.'
                        : 'The waiting entry was sent.', 'good');
    } else if (r && r.blocked) {
      /* Already in the sheet — the queue is wrong, not the server. */
      store(PEND_KEY, null);
      $('#pendingNote').className = 'alert err';
      alertBox(r.error);
    } else if (manual) {
      toast((r && r.error) || 'Still could not send.', 'bad');
    }
  }, function (e) {
    if (manual) toast('Still cannot reach the server: ' +
                      String(e && e.message || e), 'bad');
  });
}
window.addEventListener('online', function () { retryPending(); });

/* ============================================== alert dock ============== */
/*
 * The same fixed, self-measuring strip as the oven timer, so the two stack
 * rather than fight for the top of the screen. Red, counting down, and every
 * row opens Grade Reporting with that slab already chosen — the point is that
 * a supervisor who has just read the Telegram message does not then have to
 * find the slab in a list of four thousand.
 */
var AL = { items: [], skew: 0, enabled: false, canReport: false, timer: null, poll: null };
var AL_OPEN = false;

function alertStart() {
  alertFetch();
  clearInterval(AL.timer); clearInterval(AL.poll);
  AL.timer = setInterval(alertRender, 1000);
  AL.poll  = setInterval(alertFetch, 60000);
}

function alertFetch() {
  if (!S.token) return;
  gs('api_alerts', S.token).then(function (r) {
    if (!r || !r.ok) return;
    /* Operators never see alerts; stop polling for them (see ovenFetch). */
    if (!r.enabled) { clearInterval(AL.poll); AL.poll = null; }
    AL.enabled = !!r.enabled;
    AL.canReport = !!r.canReport;
    AL.items = r.items || [];
    AL.skew = (r.now || Date.now()) - Date.now();
    alertRender();
  }, function () {});
}

function alertNow() { return Date.now() + AL.skew; }

function alertRender() {
  var dock = $('#alertDock');
  if (!dock) return;
  if (!AL.enabled || !AL.items.length) {
    if (dock.innerHTML) { dock.innerHTML = ''; dock.dataset.sig = ''; setDockHeights(); }
    return;
  }
  var now = alertNow();
  var live = AL.items.filter(function (a) { return !a.dueMs || a.dueMs > now; });
  if (!live.length) {
    if (dock.innerHTML) { dock.innerHTML = ''; dock.dataset.sig = ''; setDockHeights(); }
    return;
  }

  var sig = live.map(function (a) { return a.id; }).join(',') + '|' + (AL_OPEN ? 1 : 0);
  if (dock.dataset.sig === sig) { alertTick(now, live); return; }
  dock.dataset.sig = sig;

  dock.innerHTML = '';
  var box = el('div', 'adock' + (AL_OPEN ? ' open' : ''));

  var head = el('button', 'ad-head');
  head.type = 'button';
  head.appendChild(el('span', 'ad-dot'));
  head.appendChild(el('span', 'ad-lead', live.length === 1
    ? '1 slab needs a grade report'
    : live.length + ' slabs need a grade report'));
  var peek = el('div', 'ad-peek');
  peek.appendChild(el('span', 'slab', live[0].slab));
  peek.appendChild(el('span', 'gr', live[0].grade));
  peek.appendChild(el('span', 'clock', ''));
  peek.appendChild(el('span', 'ad-chev'));
  head.appendChild(peek);
  head.onclick = function () {
    AL_OPEN = !AL_OPEN;
    box.classList.toggle('open', AL_OPEN);
    dock.dataset.sig = '';
    buzz();
    setDockHeights();
  };
  box.appendChild(head);

  var body = el('div', 'ad-body');
  live.forEach(function (a) {
    var row = el('button', 'ad-row');
    row.type = 'button';
    row.dataset.alert = a.id;
    row.appendChild(el('span', 's', a.slab));
    row.appendChild(el('span', 'g', a.grade));
    var t = el('span', 't');
    t.appendChild(el('span', 'v', ''));
    t.appendChild(el('i', null, 'left'));
    row.appendChild(t);
    row.onclick = function () { openGradeReport(a); };
    body.appendChild(row);
  });
  if (!AL.canReport) {
    body.appendChild(el('div', 'ad-sub',
      'Grade Reporting is not assigned to you — ask your administrator to add it.'));
  }
  box.appendChild(body);

  dock.appendChild(box);
  alertTick(now, live);
  setDockHeights();
}

function alertTick(now, live) {
  var clock = document.querySelector('#alertDock .ad-peek .clock');
  if (clock && live[0]) clock.textContent = fmtDur(live[0].dueMs - now);
  live.forEach(function (a) {
    var cell = document.querySelector('#alertDock .ad-row[data-alert="' +
      String(a.id).replace(/"/g, '') + '"] .t .v');
    if (cell) cell.textContent = fmtDur(a.dueMs - now);
  });
}

/** Open the form with the slab already chosen. */
function openGradeReport(a) {
  if (!AL.canReport) {
    toast('Grade Reporting is not assigned to you.', 'bad');
    return;
  }
  if (openSheets.length) closeTop();
  AL_OPEN = false;
  loadForm('gradeReport', {}, function () {
    S.values.alertId = a.id;
    applyToControl('slab', a.slab);
    updateSummary();
    var n = S.nodes.sections;
    if (n) setTimeout(function () {
      n.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 350);
  });
}

/**
 * Both fixed strips measure themselves into CSS variables, and .main starts
 * below their total. Sticky elements whose height is guessed are how the top
 * of a form ends up permanently under a banner.
 */
function setDockHeights() {
  var a = $('#alertDock'), o = $('#ovenDock');
  var ah = a && a.firstChild ? a.getBoundingClientRect().height : 0;
  var oh = o && o.firstChild ? o.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty('--alert', Math.round(ah) + 'px');
  document.documentElement.style.setProperty('--oven', Math.round(oh) + 'px');
}

/* ============================================ notifications (Telegram) == */
/*
 * The whole linking flow, on the phone the supervisor already has in their
 * hand. Connect opens Telegram with the code carried in the link, so the
 * message they send is "/start ABC123" rather than a bare "/start" that
 * identifies nobody — which is what made the old arrangement need an
 * administrator in the editor issuing codes by hand.
 */
var NT = { st: null, poll: 0, tries: 0, loading: false };

function canNotify() {
  var r = S.user && S.user.role;
  return r === 'supervisor' || r === 'admin';
}

function openNotify() {
  sheetOpen('#notify', notifyStopPoll);
  loadNotify();
}
$('#mNotify').onclick = function () { closeTop(); setTimeout(openNotify, 260); };
$('#notifyBtnD').onclick = openNotify;
$('#ntReload').onclick = function () { loadNotify(); };

/**
 * One cheap read at sign-in, so a supervisor who has never connected is
 * nudged by the dot in the sidebar and the line under the menu row instead of
 * having to open the page to find out.
 */
function notifyPeek() {
  gs('api_telegramCheck', S.token).then(function (r) {
    if (!r || !r.eligible) return;
    notifyMark(!!r.linked);
  }, function () {});
}
function notifyMark(linked) {
  var d = $('#ntDotD');
  if (d) d.className = 'nav-dot ' + (linked ? 'on' : 'off');
  var mn = $('#mnNotify');
  if (mn) mn.textContent = linked ? 'Connected to Telegram'
                                  : 'Not connected — tap to set it up';
}

function notifyOpen() { return $('#notify').classList.contains('on'); }

function loadNotify() {
  if (NT.loading) return;
  NT.loading = true;
  if (!NT.st) $('#ntBody').innerHTML = '<div class="opt-empty">Loading&hellip;</div>';
  gs('api_telegramStatus', S.token).then(function (r) {
    NT.loading = false;
    NT.st = r || {};
    renderNotify();
  }, function (e) {
    NT.loading = false;
    $('#ntBody').innerHTML = '<div class="opt-empty">' +
      esc(String(e && e.message || e)) + '</div>';
  });
}

/* ---- polling while the user is over in Telegram ------------------------- */
function notifyStartPoll() {
  notifyStopPoll();
  NT.tries = 0;
  NT.poll = setInterval(notifyTick, 3000);
}
function notifyStopPoll() { if (NT.poll) { clearInterval(NT.poll); NT.poll = 0; } }
function notifyTick() {
  if (!notifyOpen()) { notifyStopPoll(); return; }
  if (++NT.tries > 80) { notifyStopPoll(); return; }   // four minutes, then rest
  gs('api_telegramCheck', S.token).then(function (r) {
    if (!r || !r.linked) return;
    notifyStopPoll();
    buzz(30);
    toast('Connected. Alerts will reach you on Telegram.', 'good');
    loadNotify();
  }, function () {});
}
/* Coming back from Telegram is the moment to look, poll or no poll. */
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !notifyOpen()) return;
  if (NT.st && NT.st.linked) return;
  notifyTick();
});

/* ---- drawing ------------------------------------------------------------ */
function renderNotify() {
  var st = NT.st || {};
  if (st.eligible) notifyMark(!!st.linked);
  var b = $('#ntBody');
  b.innerHTML = '';
  var wrap = el('div', 'nt-wrap');
  b.appendChild(wrap);

  if (!st.eligible) {
    wrap.appendChild(ntCard([ntState('off', 'Not available'),
      ntP('Grade alerts go to supervisors. Ask your administrator if you should ' +
          'be one.')]));
    return;
  }

  if (st.enabled === false) {
    wrap.appendChild(ntCard([ntState('off', 'Alerts are switched off'),
      ntP('Telegram alerting is turned off for the whole app ' +
          '(<b>FORMS_ALERT.TELEGRAM_ENABLED</b>).')]));
    return;
  }

  /* ---- the bot has no token yet ---- */
  if (!st.configured) {
    if (!st.admin) {
      wrap.appendChild(ntCard([ntState('off', 'Not set up yet'),
        ntP(st.error ? esc(st.error)
                     : 'The Telegram bot has not been set up. Your administrator ' +
                       'needs to do that once, then this page will connect you.')]));
      return;
    }
    wrap.appendChild(ntTokenCard(st));
    return;
  }

  /* ---- connected ---- */
  if (st.linked) {
    var okc = ntCard([
      ntState('on', 'Connected'),
      ntP('You will get a Telegram message the moment Q.C. Final grades a slab <b>' +
          esc(st.grades) + '</b>, with a link that opens Grade Reporting with the ' +
          'slab already filled in. Alerts stay live for ' + esc(String(st.hours)) +
          ' hours.')
    ]);
    var row = el('div', 'nt-row');
    var t = el('button', 'btn ghost', 'Send a test message');
    t.onclick = function () {
      busy(t, true, 'Sending');
      gs('api_telegramTest', S.token).then(function (r) {
        busy(t, false);
        toast(r && r.ok ? 'Sent — check Telegram.'
                        : (r && r.error) || 'Could not send it.', r && r.ok ? 'good' : 'bad');
      }, function (e) { busy(t, false); toast(String(e && e.message || e), 'bad'); });
    };
    var d = el('button', 'btn ghost', 'Disconnect');
    d.onclick = function () {
      busy(d, true, 'Disconnecting');
      gs('api_telegramUnlink', S.token).then(function () {
        busy(d, false); NT.st = null; loadNotify();
      }, function (e) { busy(d, false); toast(String(e && e.message || e), 'bad'); });
    };
    row.appendChild(t); row.appendChild(d);
    okc.appendChild(row);
    wrap.appendChild(okc);
    if (st.admin) ntAdminCards(wrap, st);
    return;
  }

  /* ---- not connected: the one button that matters ---- */
  var c = ntCard([
    ntState('wait', 'Not connected'),
    ntP('Tap the button. Telegram opens with your code already in the message — ' +
        'press <b>START</b> and you are done. The bot answers within a minute ' +
        'and this page turns green by itself.')
  ]);

  if (st.link) {
    var a = document.createElement('a');
    a.className = 'btn amber block lg';
    a.href = st.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Connect to Telegram';
    a.onclick = function () { notifyStartPoll(); };
    c.appendChild(a);
    wrap.appendChild(c);

    /* The deep link only carries the code into a chat you have never opened.
       Once you have messaged the bot even once, tapping it just opens the chat
       and sends nothing — so the code has to be pastable, and that path has to
       be visible rather than buried as a footnote. */
    var c2 = ntCard([
      el('p', 'nt-h', 'If Telegram just opens the chat'),
      ntP('That happens when you have messaged <b>@' + esc(st.bot) + '</b> ' +
          'before — there is no START button left to press. Send it this code ' +
          'as an ordinary message instead:')
    ]);
    var line = el('div', 'nt-row');
    line.style.alignItems = 'center';
    var codeEl = el('span', 'nt-code big', st.code);
    line.appendChild(codeEl);
    var cp = el('button', 'btn ghost', 'Copy code');
    cp.style.flex = '0 0 auto';
    cp.onclick = function () { copyText(st.code, cp); };
    line.appendChild(cp);
    c2.appendChild(line);
    c2.appendChild(ntP('Nothing else — just the six characters. The bot checks for ' +
                       'messages once a minute, so give it up to that long to ' +
                       'answer; this page turns green by itself when it does.'));
    wrap.appendChild(c2);
  } else {
    c.appendChild(ntP(esc(st.error || 'No link could be made.')));
    wrap.appendChild(c);
  }

  if (st.polling === false) {
    wrap.appendChild(ntCard([
      el('p', 'nt-h', 'One thing to know'),
      ntP('The app could not start the minute-by-minute check that reads ' +
          'messages sent to the bot, so nothing will answer your code. An ' +
          'administrator needs to run <b>installTelegramPoll()</b> once from ' +
          'the Apps Script editor.')
    ], 'nt-warn'));
  }

  if (st.admin) ntAdminCards(wrap, st);
}

/* ---- pieces ------------------------------------------------------------- */
function ntCard(kids, extra) {
  var c = el('div', 'nt-card' + (extra ? ' ' + extra : ''));
  (kids || []).forEach(function (k) { c.appendChild(k); });
  return c;
}
function ntState(kind, text) {
  var d = el('div', 'nt-state');
  d.appendChild(el('span', 'nt-dot ' + kind));
  d.appendChild(el('b', null, text));
  return d;
}
function ntP(html) { var p = el('p', 'nt-p'); p.innerHTML = html; return p; }

/** Admin only: paste the @BotFather token here instead of in Project Settings. */
function ntTokenCard(st) {
  var c = ntCard([
    ntState('off', 'The bot is not set up'),
    ntP('One time, and only you can do it:')
  ]);
  var ol = el('ol', 'nt-steps');
  [ 'In Telegram, message <b>@BotFather</b> and send <b>/newbot</b>.',
    'Answer its two questions (a name, then a username ending in <i>bot</i>).',
    'It replies with a token. Paste it below.'
  ].forEach(function (t) { var li = document.createElement('li'); li.innerHTML = t; ol.appendChild(li); });
  c.appendChild(ol);

  var inp = document.createElement('input');
  inp.className = 'nt-input';
  inp.placeholder = '8123456789:AAH-…';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.autocapitalize = 'off'; inp.autocorrect = 'off';
  c.appendChild(inp);

  var save = el('button', 'btn amber block lg', 'Save the token');
  save.onclick = function () {
    var v = inp.value.trim();
    if (!v) { toast('Paste the token first.', 'bad'); return; }
    busy(save, true, 'Checking');
    gs('api_telegramSaveToken', S.token, v).then(function (r) {
      busy(save, false);
      if (!r || r.ok === false) { toast((r && r.error) || 'Telegram refused it.', 'bad'); return; }
      inp.value = '';
      NT.st = r; renderNotify();
      toast('Saved. The bot is @' + (r.bot || '') + '.', 'good');
    }, function (e) { busy(save, false); toast(String(e && e.message || e), 'bad'); });
  };
  c.appendChild(save);
  c.appendChild(ntP('It is stored in the project’s own settings, not in the ' +
                    'sheet and not in any file.'));
  if (st && st.error) c.appendChild(ntP('<b>' + esc(st.error) + '</b>'));
  return c;
}

/** Admin only: is anything actually watching Q.C., and who is linked. */
function ntAdminCards(wrap, st) {
  if (!st.scanning) {
    var w = ntCard([
      ntState('off', 'Nothing is watching Q.C. Final'),

    };

  }

  var fix = ntCard([

    ntP('This throws away anything Telegram is still holding and makes sure the ' +
        'minute-by-minute check is running. Reach for it if the bot goes quiet ' +
        'or starts repeating itself.')
  ]);
  var rb = el('button', 'btn ghost block', 'Reset the bot connection');
  rb.onclick = function () {
    busy(rb, true, 'Clearing');
    gs('api_telegramReset', S.token).then(function (r) {
      busy(rb, false); NT.st = r; renderNotify();

  };
  fix.appendChild(rb);

  var team = st.team || [];

  if (!team.length) {

      li.appendChild(el('span', null, p.name));

/* ============================================== feedback (admin) ======== */
var FB = { entries: [], unattended: [], tab: 'reported', q: '', open: 0 };

function isAdmin() { return S.user && S.user.role === 'admin'; }

function openFeedback() {
  sheetOpen('#feedback');
  if (!FB.entries.length && !FB.unattended.length) loadFeedback();
  else drawFeedback();
}

function loadFeedback() {
  $('#fbList').innerHTML = '<div class="opt-empty">Loading…</div>';
  gs('api_feedback', S.token, 150).then(function (r) {
    if (!r || !r.ok) { $('#fbList').innerHTML = '<div class="opt-empty">Could not load.</div>'; return; }
    FB.entries = r.entries || [];
    FB.unattended = r.unattended || [];
    FB.open = r.open || 0;
    drawFeedback();
  }, function (e) {
    $('#fbList').innerHTML = '<div class="opt-empty">' + esc(String(e && e.message || e)) + '</div>';
  });
}

function drawFeedback() {
  var list = $('#fbList');
  list.innerHTML = '';
  var q = FB.q.trim().toLowerCase();

  document.querySelectorAll('.fb-tab').forEach(function (b) {
    b.classList.toggle('on', b.dataset.tab === FB.tab);
  });

  if (FB.tab === 'unattended') {
    var un = FB.unattended.filter(function (u) {
      return !q || (u.slab + ' ' + u.grade).toLowerCase().indexOf(q) !== -1;
    });
    if (!un.length) {
      list.appendChild(el('div', 'opt-empty',
        FB.unattended.length ? 'Nothing matches.' : 'Nothing has gone unattended. Good.'));
    }
    un.forEach(function (u) {
      var t = el('div', 'fbtile un');
      var h = el('div', 'fb-h');
      h.appendChild(el('b', null, u.slab));
      h.appendChild(el('span', 'fb-g g' + u.grade.replace(/[^A-Za-z]/g, ''), u.grade));
      h.appendChild(el('span', 'fb-when', u.when));
      t.appendChild(h);
      t.appendChild(el('div', 'fb-sub',
        'Raised ' + u.when + ' — nobody reported it within ' + ALERT_HOURS() + ' hours.' +
        (u.notified ? '  (' + u.notified + ')' : '')));
      list.appendChild(t);
    });
  } else {
    var ent = FB.entries.filter(function (e) {
      if (!q) return true;
      var hay = (e.slab + ' ' + e.grade + ' ' + e.who + ' ' +
        e.sections.map(function (s) { return s.defects + ' ' + s.area; }).join(' ')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if (!ent.length) {
      list.appendChild(el('div', 'opt-empty',
        FB.entries.length ? 'Nothing matches.' : 'No grade reports yet.'));
    }
    ent.forEach(function (e) { list.appendChild(feedbackTile(e)); });
  }

  $('#fbFoot').innerHTML = '';
  $('#fbFoot').appendChild(el('span', null,
    FB.entries.length + ' reported · ' + FB.unattended.length + ' unattended · ' +
    FB.open + ' live'));
}

function ALERT_HOURS() { return 3; }

function feedbackTile(e) {
  var t = el('div', 'fbtile');
  var h = el('button', 'fb-h');
  h.type = 'button';
  h.appendChild(el('b', null, e.slab));
  h.appendChild(el('span', 'fb-g g' + String(e.grade).replace(/[^A-Za-z]/g, ''), e.grade));
  h.appendChild(el('span', 'fb-when', e.when));
  h.appendChild(el('span', 'fb-cnt', e.sections.length +
    (e.sections.length === 1 ? ' section' : ' sections')));
  h.appendChild(el('span', 'caret'));
  t.appendChild(h);

  var body = el('div', 'fb-body');
  body.appendChild(el('div', 'fb-sub', 'Reported by ' + (e.who || '—')));
  e.sections.forEach(function (sec) {
    var b = el('div', 'fb-sec');
    var sh = el('div', 'fb-sech');
    sh.appendChild(el('span', 'n', String(sec.n)));
    sh.appendChild(el('b', null, /^\d+$/.test(String(sec.n)) ? 'Section ' + sec.n
                                                             : String(sec.n)));
    sh.appendChild(el('span', 'fb-area', sec.area || '—'));
    b.appendChild(sh);
    [['Defects', sec.defects], ['Reason', sec.reason], ['Solution', sec.solution]]
      .forEach(function (pair) {
        if (!pair[1]) return;
        var r = el('div', 'fb-kv');
        r.appendChild(el('span', 'k', pair[0]));
        r.appendChild(el('span', 'v', pair[1]));
        b.appendChild(r);
      });
    if (sec.photos.length || sec.videos.length) {
      var links = el('div', 'fb-media');
      sec.photos.forEach(function (u, i) { links.appendChild(mediaLink(u, 'Photo ' + (i + 1))); });
      sec.videos.forEach(function (u, i) { links.appendChild(mediaLink(u, 'Video ' + (i + 1))); });
      b.appendChild(links);
    }
    body.appendChild(b);
  });
  t.appendChild(body);

  h.onclick = function () { t.classList.toggle('open'); buzz(); };
  return t;
}

function mediaLink(url, label) {
  var a = el('a', 'fb-mlink', label);
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

$('#fbClose').onclick = closeTop;
$('#fbReload').onclick = loadFeedback;
$('#fbSearch').addEventListener('input', function () {
  FB.q = this.value;
  $('#fbClear').classList.toggle('on', !!this.value);
  drawFeedback();
});
$('#fbClear').onclick = function () {
  $('#fbSearch').value = ''; FB.q = ''; this.classList.remove('on'); drawFeedback();
};
document.querySelectorAll('.fb-tab').forEach(function (b) {
  b.onclick = function () { FB.tab = b.dataset.tab; drawFeedback(); };
});
$('#mFeedback').onclick = function () { closeTop(); setTimeout(openFeedback, 260); };

/* ====================================================== safety nets ===== */
window.addEventListener('beforeunload', function (e) {
  if (S.form && Object.keys(S.values).length) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.form) doSubmit();
  if (e.key === 'Escape' && openSheets.length) closeTop();
});
/* iOS: double-tap-to-zoom fires a 350ms click delay and mis-taps on pills */
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

})();
</script>
