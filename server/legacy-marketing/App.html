<script>
/* Domestic Marketing — browser app.
 * Renders instantly from a localStorage snapshot, then asks the server only for what changed.
 * All lists, filters and analytics run in the browser on data it already has. */
(function () {
'use strict';

/* ================================================================ utils */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isEmpty = v => v === undefined || v === null || v === '';
const pad = n => String(n).padStart(2, '0');

};
function fmtD(ms) { if (!ms) return '—'; const d = new Date(+ms); return pad(d.getDate()) + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtT(ms) { const d = new Date(+ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDT(ms) { if (!ms) return '—'; return fmtD(ms) + ', ' + fmtT(ms); }
function fmtDay(ms) { const d = new Date(+ms); return WD[d.getDay()] + ', ' + pad(d.getDate()) + ' ' + MON[d.getMonth()]; }
function human(ms) {
  ms = Math.abs(ms); const m = Math.round(ms / 6e4);

}
const ago = ms => ms ? (Date.now() - ms < 6e4 ? 'just now' : human(Date.now() - ms) + ' ago') : '—';
function toInput(ms) { if (isEmpty(ms)) return ''; const d = new Date(+ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayStart(v) { if (!v) return 0; const p = v.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).getTime(); }

const monthStart = ms => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };

function prepC(c) {
  c._st = leadOf(c);
  c._s = [c.id, c.shop, c.contact, c.mobile, c.city, c.area, c.address, c.brands, c.ownerName, c.type, c.details, DEF.leadStatus[c._st], c.closeReason].filter(Boolean).join(' ').toLowerCase();
  c._p = custPriority(c, S.settings); c._seg = rateSegment(c.avgRate, S.settings);
  return c;
}
function prepV(v) {
  v._s = [v.id, v.shop, v.city, v.area, v.userName, v.brands, v.outcome, v.notes].filter(Boolean).join(' ').toLowerCase();
  v._f = splitList(v.flags);

}
function prepL(l) { l._s = [l.id, l.shop, l.city, l.area, l.userName, l.status, l.dir, l.purposes, l.answersText, l.notes].filter(Boolean).join(' ').toLowerCase(); return l; }
function prepO(o) { o._s = [o.id, o.shop, o.city, o.area, o.itemsText, o.by, oLabel(orderStage(o)), o.invoiceNo, o.vehicleNo, o.driverName, o.terms].filter(Boolean).join(' ').toLowerCase(); return o; }
function prepP(p) { p._s = [p.name, p.series, p.color, p.finish, p.desc].filter(Boolean).join(' ').toLowerCase(); return p; }
const matchQ = o => { for (const t of S.qTerms) if ((o._s || '').indexOf(t) < 0) return false; return true; };
const strip = o => { const x = Object.assign({}, o); delete x._s; delete x._p; delete x._f; delete x._seg; delete x._st; return x; };

function ingest(p) {
  if (!p || p.same) { if (p) S.since = p.now; return false; }
  if (p.build && p.build !== BUILD && !S.updShown) {
    S.updShown = 1;
    setTimeout(() => modal('<h2>Domestic Marketing was updated</h2><p class="msub">Reload to get the latest screens.</p>' +
      '<div class="modal-foot"><button class="btn btn-ghost" data-act="mCancel">Later</button><a class="btn btn-dark" href="' + esc(p.url || S.url || '') + '" target="_top">Reload now</a></div>'), 300);
  }
  const setChanged = JSON.stringify(p.settings) !== JSON.stringify(S.settings);
  S.me = p.me; S.users = p.users; S.lists = p.lists; S.settings = p.settings; S.forms = p.forms || S.forms; S.callForms = p.callForms || S.callForms; S.url = p.url || S.url;
  if (p.full) { S.C = new Map(); S.V = new Map(); S.O = new Map(); S.P = new Map(); S.L = new Map(); S.Cdel = new Map(); S.Vdel = new Map(); S.Ldel = new Map(); S.Pdel = new Map(); S.hist = {}; S.vFrom = sod(p.now) - DEF.visitDays * DAY; }
  (p.cust || []).forEach(putC);
  (p.visits || []).forEach(putV);
  (p.orders || []).forEach(o => S.O.set(o.id, prepO(o)));
  (p.calls || []).forEach(putL);
  (p.prod || []).forEach(putP);
  if (setChanged && !p.full) S.C.forEach(prepC);
  S.since = p.now;
  persist();
  return true;
}
let _pt = 0;
function persist() {
  clearTimeout(_pt);
  _pt = setTimeout(() => {
    const cut = sod(Date.now()) - DEF.visitDays * DAY;
    LS.set('dm_snap', {
      me: S.me, users: S.users, lists: S.lists, settings: S.settings, forms: S.forms, callForms: S.callForms, url: S.url, since: S.since, vFrom: Math.max(S.vFrom, cut),
      cust: both('C').map(strip), visits: both('V').filter(v => v.at >= cut).map(strip),
      orders: Array.from(S.O.values()).map(strip), prod: both('P').map(strip), calls: both('L').filter(l => l.at >= cut).map(strip)
    });
  }, 500);
}
const DM = { C: 'Cdel', V: 'Vdel', L: 'Ldel', P: 'Pdel' };
const both = k => Array.from(S[k].values()).concat(Array.from(S[DM[k]].values()));
/** Store a record in the live map, or in the deleted map when it is marked deleted (it can still be opened). */
function putRec(k, o, prep) {
  if (!o) return;
  if (o.deleted) { S[k].delete(o.id); S[DM[k]].set(o.id, prep(o)); } else { S[DM[k]].delete(o.id); S[k].set(o.id, prep(o)); }
}
const putC = c => putRec('C', c, prepC);
const putV = v => putRec('V', v, prepV);
const putL = l => putRec('L', l, prepL);
const putP = x => putRec('P', x, prepP);

/** Make sure visits from `from` onward are loaded (older ones are fetched once per session). */
function ensureVisits(from) {
  if (!from || from >= S.vFrom) return Promise.resolve(false);
  if (S.vLoading) return S.vLoading;
  const to = S.vFrom;
  return S.vLoading = Promise.all([api('getVisitsRange', S.token, from, to), api('getCallsRange', S.token, from, to)]).then(r => {
    r[0].forEach(putV); r[1].forEach(putL); S.vFrom = from; S.vLoading = null; return true;
  }).catch(e => { S.vLoading = null; toast(e.message, 'err'); return false; });
}

/* ================================================================ server calls */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(err => {
      const msg = String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
      if (msg === 'AUTH') { logout(true); return rej(new Error('Your session has expired — please sign in again.')); }
      if (/removed from the sheet|deleted\. Refresh/.test(msg)) setTimeout(() => doSync(), 300);
      rej(new Error(msg));
    })[fn].apply(null, args);
  });
}
function setSync(state) {
  const d = $('#syncDot'), t = $('#syncTxt');
  if (!d) return;
  d.className = 'src-dot' + (state === 'live' ? ' live' : state === 'busy' ? ' busy' : '');
  t.textContent = state === 'busy' ? 'Saving…' : state === 'off' ? 'Offline — retrying' : 'Live';
}

/* ================================================================ uploads */
function readB64(blob) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => bad(new Error('Could not read the file.')); r.readAsDataURL(blob); });
}
function upProg(txt, pct) { $('#upbar').hidden = false; $('#upTxt').textContent = txt + ' — ' + pct + '%'; $('#upFill').style.width = pct + '%'; }
function upDone() { $('#upbar').hidden = true; }
/** ≤ 5 MB in one call; bigger files (videos, PDFs) go to Drive in 8 MB pieces. → {url, id} */
async function uploadBlob(blob, name, mime, label) {
  if (blob.size > 100 * 1048576) throw new Error(label + ' is over 100 MB.');
  upProg(label, 0);
  if (blob.size <= 5 * 1048576) { const r = await api('uploadMedia', S.token, name, mime, await readB64(blob)); upProg(label, 100); return r; }
  const s = await api('bigUploadStart', S.token, name, mime, blob.size);
  let off = 0;
  for (;;) {
    upProg(label, Math.round(off * 100 / blob.size));
    const r = await api('bigUploadChunk', S.token, s.key, off, await readB64(blob.slice(off, off + s.chunk)));
    if (r.done) return r;
    off = r.got;
  }
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
/** Shrink to 1600 px and burn the proof (time · GPS · who) into the photo. */
async function stampPhoto(file, lines) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
    cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
    if (lines && lines.length) {
      const fs = Math.max(14, Math.round(cv.width / 46)), lh = fs * 1.35, h = lh * lines.length + fs * 0.9;
      g.fillStyle = 'rgba(20,19,17,.74)'; g.fillRect(0, cv.height - h, cv.width, h);
      g.fillStyle = '#F2C14E'; g.fillRect(0, cv.height - h, Math.max(5, fs / 3), h);
      g.font = '600 ' + fs + 'px Inter, Arial, sans-serif'; g.fillStyle = '#fff'; g.textBaseline = 'top';
      lines.forEach((t, i) => g.fillText(t, fs * 0.9, cv.height - h + fs * 0.45 + i * lh));
    }
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
const stampName = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()); };

/* ================================================================ toast / modal / lightbox */
let _tt = 0;
function toast(msg, kind) {

  clearTimeout(_tt); _tt = setTimeout(() => t.className = 'toast', kind === 'err' ? 5200 : 2800);
}
let _mres = null, _mlock = false;
/** Every date box in a form gets a × that clears it in one tap (shown only when a date is set). */
function enhanceDates(root) {
  $$('input[type=date]', root).forEach(i => {
    if (i.parentNode.classList.contains('dwrap')) return;
    const w = document.createElement('span'); w.className = 'dwrap' + (i.value ? ' has' : '');
    i.parentNode.insertBefore(w, i); w.appendChild(i);
    w.insertAdjacentHTML('beforeend', '<button type="button" class="dclr" data-act="clrDate" aria-label="Clear date" title="Clear date">×</button>');
  });
}
function modal(html, cls, lock) {
  const b = $('#modalBody'); b.className = 'modal ' + (cls || ''); b.innerHTML = html;
  $('#modal').classList.add('on'); _mlock = !!lock;
  const f = b.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select');
  if (f && window.innerWidth > 860) setTimeout(() => f.focus(), 30);
}
function closeModal(force) {
  if (_mlock && !force) return;
  $('#modal').classList.remove('on'); _mlock = false;
  if (S.form && S.form.watch != null) stopGps();
  dropFormMap();

}

function busy(btn, on) {

function lightbox(url, kind, cap) {

  lb.innerHTML = body + '<div class="lbc">' + esc(cap || '') + ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">Open in Drive ↗</a> · tap outside to close</div>';

  if (window.Chart) return Promise.resolve();

const PAL = ['#D9A52C', '#5E7FA6', '#4F9D69', '#CF4F33', '#E0892F', '#232220', '#8E6CB0', '#3F9C9A', '#B5838D', '#6D6875'];
const TIERC = { A: '#4F9D69', B: '#D9A52C', C: '#9A968B' };
/** points: [{lat, lng, color, label, pop, circle}] — opts.line draws the route in order. */
async function drawMap(el, points, opts, bucket) {
  if (!el) return;
  try { await loadMap(); } catch (e) { el.innerHTML = '<div class="empty">Map could not load (no internet?)</div>'; return; }
  if (!el.isConnected) return;
  const L = window.L, m = L.map(el, { scrollWheelZoom: false, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  const pts = points.filter(p => !isEmpty(p.lat) && !isEmpty(p.lng));
  pts.forEach(p => {
    const mk = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div class="pin" style="background:' + (p.color || '#232220') + '"><b>' + esc(p.label || '') + '</b></div>', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] }) }).addTo(m);
    if (p.pop) mk.bindPopup(p.pop);
    if (p.circle) L.circle([p.lat, p.lng], { radius: p.circle, color: '#4F9D69', weight: 1, fillOpacity: .08 }).addTo(m);
  });
  if (opts && opts.line && pts.length > 1) L.polyline(pts.map(p => [p.lat, p.lng]), { color: '#232220', weight: 3, opacity: .6, dashArray: '6 6' }).addTo(m);
  if (pts.length === 1) m.setView([pts[0].lat, pts[0].lng], 16);
  else if (pts.length) m.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.2));
  else m.setView([22.5, 79], 4);
  (bucket || S.maps).push(m);

  const bars = (rows, cls) => rows.length ? rows.map(r => '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px"><span>' + esc(r[0]) + '</span><span class="num">' + r[1] + '</span></div><div class="bar ' + cls + '"><i style="width:' + Math.round(r[1] / rows[0][1] * 100) + '%"></i></div></div>').join('') : '<div class="empty" style="padding:12px">No decisions yet.</div>';
  const exM = {}; groups.HANDED.forEach(c => { const k = c.standExec || '?'; exM[k] = (exM[k] || 0) + (Number(c.standQty) || 1); });
  const exRows = Object.keys(exM).sort((a, b) => exM[b] - exM[a]).map(k => [k, exM[k]]);
  h += '<div class="card">' + (exRows.length ? '<div class="card-h"><h3>Stands with executives</h3><span class="sub">Handed over, not yet placed</span></div>' + bars(exRows, '') + '<div style="height:12px"></div>' : '') +
    '<div class="card-h"><h3>Why included</h3><span class="sub">Given + to give</span></div>' + bars(inc, 'ok') +
    '<div class="card-h" style="margin-top:18px"><h3>Why excluded</h3></div>' + bars(exc, 'bad') + '</div></div>';

}

async function submitStep(f) {
  const F = S.form, E = f.elements, o = S.O.get(F && F.id); if (!F || !o) return;
  const bad = (el, msg) => { if (el) { el.classList.add('err'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } toast(msg, 'err'); };
  const v = n => E[n] ? String(E[n].value).trim() : '', dt = n => E[n] && E[n].value ? dayStart(E[n].value) : '', Sx = S.settings;
  const st = F.st, d = { step: st, remark: v('remark') }, rq = k => reqOf(st, k, Sx);
  const ar = f.querySelector('input[name=ans]:checked'), act = ar ? ar.dataset.actx : 'next';
  if (answersOf(st, Sx).length && !ar) return toast('Pick the answer', 'err');
  if (ar) d.ans = ar.value;
  if (act !== 'next') {
    if (!d.remark) return bad(E.remark, 'Write a remark');

    else if (E.override && E.override.checked) { d.override = true; d.reason = v('oreason'); if (!d.reason) return bad(E.oreason, 'Why may it move on without full payment?'); delete F.files.proof; }
    else {

      if (!(Number(d.amt) > 0)) return bad(E.amt, 'Enter the amount received'); if (!d.mode) return bad(E.mode, 'Pick how it was paid');
      if (Number(d.amt) > Number(E.amt.max)) return bad(E.amt, 'That is more than the ' + inr(E.amt.max) + ' still due');

    const ot = Number(o.total) || 0, tl = S.settings.invTolPct != null ? Number(S.settings.invTolPct) : 2, gap = ot ? Math.abs(Number(d.invoiceAmt) - ot) / ot * 100 : 100;
    if (Number(d.invoiceAmt) > 0 && gap > tl + 1e-9) { if (!isBoss()) return bad(E.invoiceAmt, 'The invoice is ' + Math.round(gap * 10) / 10 + '% away from the order value (allowed ±' + tl + '%) — check it, or ask admin / manager'); if (!d.invoiceReason) return bad(E.invoiceReason, 'Why is the invoice ' + Math.round(gap * 10) / 10 + '% away from the order value?'); }
    if (!d.invoiceNo) return bad(E.invoiceNo, 'Enter the invoice number'); if (!(Number(d.invoiceAmt) > 0)) return bad(E.invoiceAmt, 'Enter the invoice amount');
    if (rq('invoiceFile') && !F.files.invoiceFile) return toast('Attach the invoice photo or PDF', 'err');
  } else if (st === 'DISPATCH') {
    ['vehicleNo', 'driverName', 'driverMobile', 'transporter', 'lrNo'].forEach(k => d[k] = v(k));
    const day = dt('dispatchAt'); d.dispatchAt = !day || day === sod(Date.now()) ? Date.now() : day + 12 * 3600e3;
    const need = [['vehicleNo', 'Enter the vehicle number'], ['driverName', 'Enter the driver’s name'], ['driverMobile', 'Enter the driver’s mobile'], ['transporter', 'Enter the transporter'], ['lrNo', 'Enter the LR / bilty no.']];
    for (const n of need) if (rq(n[0]) && !d[n[0]]) return bad(E[n[0]], n[1]);
    if (d.driverMobile && !mob10(d.driverMobile)) return bad(E.driverMobile, 'Driver mobile needs 10 digits');
    if (rq('dispatchPhoto') && !F.files.dispatchPhoto) return toast('Attach the loaded vehicle photo', 'err');
  } else if (st === 'DELIVERY') {
    d.deliveredAt = dt('deliveredAt'); d.receivedBy = v('receivedBy'); d.deliveryCond = v('deliveryCond'); d.deliveryNote = v('deliveryNote');
    if (rq('receivedBy') && !d.receivedBy) return bad(E.receivedBy, 'Who received the material?'); if (d.deliveryCond !== DEF.deliveryCond[0] && !d.deliveryNote) return bad(E.deliveryNote, 'Describe the damage / shortage');
    if (rq('podPhoto') && !F.files.podPhoto) return toast('Attach the delivery proof photo', 'err');
  }
  const btn = $('#stSave'); busy(btn, true);
  try {
    const keys = Object.keys(F.files);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i], file = F.files[k], isImg = /^image\//.test(file.type);
      let blob = file; if (isImg) { try { blob = await stampPhoto(file, [o.id + ' · ' + o.shop, oLabel(st) + ' · ' + S.me.name + ' · ' + fmtDT(Date.now())]); } catch (e) { blob = file; } }
      const r = await uploadBlob(blob, o.id + '_' + k + '_' + stampName() + (isImg ? '.jpg' : '_' + (file.name || 'file')), isImg ? 'image/jpeg' : (file.type || 'application/octet-stream'), 'File ' + (i + 1) + ' of ' + keys.length);

    S.O.set(n.id, prepO(n)); persist(); closeModal(true);
    toast(act === 'stay' ? 'Saved — stays on “' + oLabel(st) + '”' + (d.followUp ? ', follow-up ' + fmtDay(d.followUp) : '') : ns === st ? 'Payment saved — balance ' + inr(oBal(n)) : ns === 'DONE' ? 'Order completed ✓' : ns === 'CANCELLED' ? 'Order cancelled' : 'Done ✓ Next: ' + oLabel(ns), 'ok');
    refresh();

}

/* ================================================================ competition */
function compData(city) {
  const shops = Array.from(S.C.values()).filter(c => (!city || c.city === city) && matchQ(c));
  const own = brandKey(S.settings.ownBrand || ''), names = {}, brandCnt = {}, areaMap = new Map();
  let noBrand = 0;
  shops.forEach(c => {
    const bs = splitList(c.brands);
    if (!bs.length) { noBrand++; return; }
    const ak = (c.area || '(no area)') + '|' + (c.city || '');
    let a = areaMap.get(ak); if (!a) { a = { area: c.area || '(no area)', city: c.city || '', shops: 0, b: {}, rate: [] }; areaMap.set(ak, a); }
    a.shops++; if (c.avgRate) a.rate.push(c.avgRate);
    const seen = {};
    bs.forEach(b => { const k = brandKey(b); if (seen[k]) return; seen[k] = 1; names[k] = names[k] || b; brandCnt[k] = (brandCnt[k] || 0) + 1; a.b[k] = (a.b[k] || 0) + 1; });
  });
  const brands = Object.keys(brandCnt).sort((x, y) => brandCnt[y] - brandCnt[x]);
  return { shops, mapped: shops.length - noBrand, noBrand, brands, names, brandCnt, own, areas: Array.from(areaMap.values()).sort((x, y) => y.shops - x.shops) };
}

    top.map(b => '<th class="r">' + esc(D.names[b]) + (b === D.own ? ' ★' : '') + '</th>').join('') + '</tr></thead><tbody>' +

      }).join('') + '</tr>';

/* ================================================================ market rates */
function rateRows() {
  const r = rangeFor(S.an.preset, S.an.from, S.an.to), out = [];
  S.V.forEach(v => {
    if (v.at < r[0] || v.at >= r[1] || (S.an.city && v.city !== S.an.city) || !matchQ(v)) return;
    (v.rates || []).forEach(x => S.an.thk && x.thk !== S.an.thk ? 0 : out.push({ brand: x.brand, k: brandKey(x.brand), product: x.product, thk: x.thk, rate: Number(x.rate), at: v.at, area: v.area, city: v.city, custId: v.custId, shop: v.shop }));
  });
  return out;
}
function vRates() {
  const a = S.an, r = rangeFor(a.preset, a.from, a.to);
  if (r[0] < S.vFrom) ensureVisits(r[0]).then(ch => { if (ch && S.view === 'rates') renderView(); });

function auditDay() {
  const a = dayStart(S.au.day), b = a + DAY, by = new Map();
  S.V.forEach(v => { if (v.source !== 'OFFICE' && v.at >= a && v.at < b && (!S.au.user || v.userId === S.au.user)) { if (!by.has(v.userId)) by.set(v.userId, []); by.get(v.userId).push(v); } });
  const out = [];
  by.forEach((vs, uid) => {
    vs.sort((x, y) => x.at - y.at);
    let km = 0, maxGap = 0;
    const steps = vs.map((v, i) => {
      const p = vs[i - 1], d = p ? geoDist(p.lat, p.lng, v.lat, v.lng) : null, gap = p ? v.at - p.at : 0;
      if (d) km += d / 1000; if (gap > maxGap) maxGap = gap;
      return { v, d, gap };
    });
    out.push({ uid, name: (user(uid) || {}).name || vs[0].userName, steps, km, maxGap, first: vs[0].at, last: vs[vs.length - 1].at, flag: vs.filter(v => v._f.length).length, pend: vs.filter(v => v.verify === 'PENDING' && !v._f.length).map(v => v.id) });
  });
  return out.sort((x, y) => y.steps.length - x.steps.length);
}

  const tab = S.au.tab;
  let h = '<div class="ctrl-bar"><div class="seg"><button class="' + (tab === 'day' ? 'on' : '') + '" data-act="auTab" data-t="day">Day timeline</button><button class="' + (tab === 'queue' ? 'on' : '') + '" data-act="auTab" data-t="queue">Review queue<span class="n">' + reviewCount() + '</span></button></div>' +
    (tab === 'day' ? '<button class="pill-t" data-act="auDay" data-d="-1">‹</button><input type="date" class="date-in" data-au="day" value="' + esc(S.au.day) + '" max="' + toInput(Date.now()) + '"><button class="pill-t" data-act="auDay" data-d="1">›</button>' : '') +
    '<select class="sel" data-au="user">' + userOpts(S.au.user) + '</select></div>';
  if (tab === 'queue') {
    const q = Array.from(S.V.values()).filter(v => v.verify === 'PENDING' && (!S.au.user || v.userId === S.au.user) && matchQ(v)).sort((x, y) => (y._f.length - x._f.length) || (y.at - x.at));
    if (!q.length) return h + '<div class="card"><div class="empty"><b>Nothing to review ✓</b>All visits are reviewed.</div></div>';
    return h + '<div class="hint" style="margin-bottom:10px">Flagged visits first. Open a visit to see its photos and map before deciding.</div><div class="vlist">' + q.slice(0, S.limit).map(vCard).join('') + '</div>' +
      (q.length > S.limit ? '<button class="more" data-act="moreList">Show more</button>' : '');
  }
  const a = dayStart(S.au.day);
  if (a < S.vFrom) ensureVisits(a).then(ch => { if (ch && S.view === 'audit') renderView(); });
  const days = auditDay(), seen = new Set(days.map(d => d.uid));
  const absent = (S.au.user ? [] : S.users.filter(u => u.active && u.role === 'exec' && !seen.has(u.id)));
  if (new Date(a).getDay() !== 0 && absent.length) h += '<div class="card" style="margin-bottom:12px;border-color:#EFC2B6"><b style="color:var(--bad)">No visits on ' + fmtDay(a) + ':</b> ' + absent.map(u => esc(u.name) + (u.mobile ? ' (' + tel(u.mobile) + ')' : '')).join(', ') + '</div>';
  if (!days.length) return h + '<div class="card"><div class="empty"><b>No visits on ' + fmtDay(a) + '</b></div></div>';
  days.forEach(d => {
    const gapBad = d.maxGap > 75 * 6e4;
    h += '<div class="aday"><div class="aday-h"><span class="avatar">' + esc(d.name.charAt(0)) + '</span><div><div class="who">' + esc(d.name) + '</div><div class="tl-time">' + fmtT(d.first) + ' → ' + fmtT(d.last) + ' · ' + human(d.last - d.first) + ' in field</div></div>' +
      '<div class="st"><span class="chip"><b>' + d.steps.length + '</b> visits</span><span class="chip"><b>' + d.km.toFixed(1) + '</b> km between shops</span><span class="chip' + (gapBad ? '" style="border-color:var(--warn);color:var(--warn)' : '') + '">Longest gap <b>' + human(d.maxGap) + '</b></span>' +
      (d.flag ? '<span class="flag">⚠ ' + d.flag + ' flagged</span>' : '') +
      '<button class="btn btn-ghost btn-sm" data-act="auMap" data-u="' + d.uid + '">' + (S.au.map === d.uid ? 'Hide route' : '🗺 Route') + '</button>' +
      (d.pend.length ? '<button class="btn btn-ok btn-sm" data-act="verifyMany" data-ids="' + d.pend.join(',') + '">✓ Verify ' + d.pend.length + ' clean</button>' : '') + '</div></div>' +
      (S.au.map === d.uid ? '<div class="map" id="auMap" style="border-radius:0;border:none;border-bottom:1px solid var(--line)"></div>' : '') +
      d.steps.map((s, i) => '<div class="astep" data-act="openV" data-id="' + s.v.id + '"><span class="tm">' + fmtT(s.v.at) + '</span>' +
        '<span class="mv' + (s.gap > 75 * 6e4 ? ' gap' : '') + '">' + (i ? '+' + human(s.gap) + ' · ' + fmtDist(s.d) : 'Start') + '</span>' +
        '<div class="bd"><div class="t">' + (i + 1) + '. ' + esc(s.v.shop) + '</div><div class="s">' + esc(s.v.area || s.v.city || '') + ' · ' + esc(s.v.outcome || '') + ' · 📷 ' + (s.v.media || []).length + ' · ±' + (isEmpty(s.v.acc) ? '?' : s.v.acc) + ' m' + (s.v.plan ? ' · ' + esc(s.v.plan) : '') + '</div>' +
        (s.v._f.length ? '<div class="flags" style="margin-top:3px">' + flagChips(s.v) + '</div>' : '') + '</div>' + revBadge(s.v) + '</div>').join('') + '</div>';
  });
  return h;
}
function aAudit() {
  if (!S.au.map || !$('#auMap')) return;
  const d = auditDay().find(x => x.uid === S.au.map); if (!d) return;
  drawMap($('#auMap'), d.steps.map((s, i) => ({ lat: s.v.lat, lng: s.v.lng, label: i + 1, color: s.v._f.length ? '#CF4F33' : '#232220', pop: '<b>' + (i + 1) + '. ' + esc(s.v.shop) + '</b><br>' + fmtT(s.v.at) + ' · ±' + s.v.acc + ' m' })), { line: true });

/* ================================================================ drawer */
function openDrawer(t, id, tab) {
  // a customer opens as a full page; a visit / call / order opened from it remembers the way back
  if (t === 'cust') S.dback = null;
  else if (S.open && S.open.t === 'cust') S.dback = { id: S.open.id, tab: S.dtab };
  else if (!S.open) S.dback = null;
  S.open = { t, id }; S.dtab = tab || '';
  renderDrawer();
  $('#drawer').classList.toggle('full', t === 'cust');
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#drawer').scrollTop = 0;
}
function closeDrawer() {
  S.open = null; S.dback = null; dropMaps(S.dmaps);
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
}
function renderDrawer() {
  if (!S.open) return;
  dropMaps(S.dmaps);
  const o = S.open, rec = { visit: S.V, cust: S.C, order: S.O, prod: S.P, call: S.L }[o.t].get(o.id) || ({ visit: S.Vdel, cust: S.Cdel, prod: S.Pdel, call: S.Ldel }[o.t] || new Map()).get(o.id);
  if (!rec) { closeDrawer(); return; }
  $('#drawer').innerHTML = { visit: drVisit, cust: drCust, order: drOrder, prod: drProd, call: drCall }[o.t](rec);
  if (rec.deleted) {
    const body = $('#drawer .dr-body'), bar = body && body.querySelector('.admin-bar');
    const box = '<div class="act bad delbox"><div class="act-h"><h4>🗑 Deleted</h4></div><div style="font-weight:600">' + esc(rec.delReason || '') + '</div>' +
      '<div class="hint" style="margin-top:4px">By ' + esc(rec.delBy || '?') + (rec.delAt ? ' on ' + fmtDT(rec.delAt) : '') + '. Nothing was erased — it is only hidden from lists and reports.' + (isAdmin() ? ' Restore brings it back.' : '') + '</div></div>';
    const rest = isAdmin() ? '<div class="admin-bar"><button class="btn btn-ok btn-sm" data-act="restore">↺ Restore</button></div>' : '';
    if (bar) bar.outerHTML = rest + box; else if (body) body.insertAdjacentHTML('afterbegin', rest + box);
  }
  if (o.t === 'visit') {
    const c = S.C.get(rec.custId), pts = [{ lat: rec.lat, lng: rec.lng, color: rec._f.length ? '#CF4F33' : '#232220', label: 'V', pop: 'Visit · ' + fmtDT(rec.at) + ' · ±' + rec.acc + ' m' }];
    if (c && !isEmpty(c.lat) && (c.lat !== rec.lat || c.lng !== rec.lng)) pts.push({ lat: c.lat, lng: c.lng, color: '#4F9D69', label: 'P', pop: 'Customer’s pin', circle: Number(S.settings.gpsRadius) });
    else if (pts[0]) pts[0].circle = Number(S.settings.gpsRadius);
    drawMap($('#dMap'), pts, null, S.dmaps);
  }
  if (o.t === 'cust' && (S.dtab || 'ov') === 'ov' && !isEmpty(rec.lat)) drawMap($('#dMap'), [{ lat: rec.lat, lng: rec.lng, color: rec._st === 'DEAD' ? '#CF4F33' : TIERC[rec._p.p], label: rec._st === 'DEAD' ? '!' : rec._p.p, circle: Number(S.settings.gpsRadius) }], null, S.dmaps);
}

function startGps() {
  const F = S.form; if (!F) return;
  stopGps();
  if (!navigator.geolocation) { F.gpsErr = 'This browser cannot read the location.'; return paintGps(); }
  F.gpsErr = ''; F.gpsBusy = true; paintGps();
  F.watch = navigator.geolocation.watchPosition(pos => {
    if (S.form !== F) return;
    const c = pos.coords;
    if (!F.gps || c.accuracy < F.gps.acc) F.gps = { lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6), acc: Math.round(c.accuracy), at: Date.now() };
    if (F.gps.acc <= 25) { F.gpsBusy = false; stopGps(); }
    paintGps();
  }, err => {
    if (S.form !== F) return;
    F.gpsErr = err.code === 1 ? 'Location permission is blocked. Allow location for this site in the browser settings, then tap Retry.' : 'Could not get the location (' + err.message + '). Step outside and tap Retry.';
    F.gpsBusy = false; stopGps(); paintGps();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  F.gpsTimer = setTimeout(() => { if (S.form === F) { F.gpsBusy = false; stopGps(); paintGps(); } }, 25000);
}
function stopGps() {
  const F = S.form; if (!F) return;
  if (F.watch != null) { try { navigator.geolocation.clearWatch(F.watch); } catch (e) {} F.watch = null; }
  clearTimeout(F.gpsTimer);
}
function paintGps() {
  const F = S.form, box = $('#gpsBox'); if (!F || !box) return;
  const g = F.gps, poor = g && g.acc > Number(S.settings.gpsMaxAcc);
  if (!g && isBoss() && !F.gpsBusy) box.innerHTML = '<div class="gpsbox"><span class="gi">🏢</span><div><div class="gt">Office entry — no location needed</div><div class="gs">' + (F.gpsErr ? esc(F.gpsErr) + ' ' : '') +
    'You can log details from anywhere. It is saved as an office entry, without GPS checks.</div></div><button type="button" class="btn btn-ghost btn-sm" data-act="gpsRetry">📍 Use my location</button></div>';
  else box.innerHTML = '<div class="gpsbox ' + (F.gpsErr && !g ? 'err' : g ? (poor ? '' : 'ok') : '') + '"><span class="gi">' + (F.gpsBusy && !g ? '<span class="spin sm" style="border-top-color:var(--amber)"></span>' : ICON.pin) + '</span><div>' +
    (g ? '<div class="gt">' + (poor ? 'Location is rough (±' + g.acc + ' m)' : 'Location captured ✓') + '</div><div class="gs">' + g.lat + ', ' + g.lng + ' · ±' + g.acc + ' m' + (F.gpsBusy ? ' · improving…' : '') + ' · ' + fmtT(g.at) + '</div>' :
      F.gpsErr ? '<div class="gt">No location</div><div class="gs">' + esc(F.gpsErr) + '</div>' : '<div class="gt">Getting your location…</div><div class="gs">Stand at the customer with GPS on.</div>') +
    '</div>' + (!F.gpsBusy ? '<button type="button" class="btn btn-ghost btn-sm" data-act="gpsRetry">' + (g ? 'Re-capture' : 'Retry') + '</button>' : '') + '</div>';
  const canCap = g || isBoss();
  $$('#caps .cap').forEach(l => { l.style.opacity = canCap ? '' : '.45'; l.style.pointerEvents = canCap ? '' : 'none'; });
  // nearby customers (closest first) — one tap picks
  const nb = $('#nearby');
  if (nb) {
    const near = g ? Array.from(S.C.values()).filter(c => !isEmpty(c.lat)).map(c => ({ c, d: geoDist(g.lat, g.lng, c.lat, c.lng) })).filter(x => x.d !== null && x.d < 400).sort((a, b) => a.d - b.d).slice(0, 6) : [];
    nb.innerHTML = near.length ? '<small class="hint" style="align-self:center;margin-right:2px">Nearby:</small>' + near.map(x => '<label><input type="radio" name="near" data-act="pickNear" data-id="' + x.c.id + '"' + (F.custId === x.c.id ? ' checked' : '') + '><span>' + (x.c._st === 'DEAD' ? '🚩 ' : '') + esc(x.c.shop) + ' · ' + fmtDist(x.d) + '</span></label>').join('') : '';
  }
  paintCust();
}
/** Picked customer: status, red flag, "are you at the pin?" check, and its category questions. */
function paintCust() {
  const F = S.form, box = $('#custCheck'); if (!F || F.kind !== 'visit' || !box) return;
  const c = S.C.get(F.custId), g = F.gps, R = Number(S.settings.gpsRadius);
  let h = '';
  if (c) {
    h += '<div class="vrow" style="margin-top:8px">' + leadChip(c) + (c.type ? '<span class="chip">' + esc(c.type) + '</span>' : '') + planTxt(c) + '</div>';
    if (c._st === 'DEAD') h += '<div class="lchk bad"><span>🚩</span><div><b>Red-flagged — not worth it.</b> ' + esc(c.closeReason || '') + ' (' + esc(c.closedBy || '') + (c.closedAt ? ', ' + fmtD(c.closedAt) : '') + '). ' +
      (isBoss() ? 'You are a manager, so you can still log a visit.' : 'Don’t spend time here — a manager must reopen it first.') + '</div></div>';
    if (!g && isBoss()) h += '<div class="lchk"><span>🏢</span><div>Office entry — location is not checked.</div></div>';
    else if (isEmpty(c.lat)) h += '<div class="lchk"><span>📍</span><div>This customer has no map pin yet — this visit will save your spot as its location.</div></div>';
    else if (!g) h += '<div class="lchk"><span>📍</span><div>Waiting for GPS to check that you are at the customer’s pin…</div></div>';
    else {
      const d = geoDist(g.lat, g.lng, c.lat, c.lng), ok = d <= R;
      h += '<div class="lchk ' + (ok ? 'ok' : 'bad') + '"><span>' + (ok ? '✓' : '✕') + '</span><div><b>' + (ok ? 'Right place' : 'You are not at the customer') + '</b> — ' + fmtDist(d) + ' from where ' + esc(c.shop) + ' is pinned' +
        (ok ? '.' : ' (allowed ' + R + ' m). Go to the customer, or this visit will be flagged “Far from pin”. ') + ' <a href="' + mapsUrl(c.lat, c.lng) + '" target="_blank" rel="noopener">Directions ↗</a></div></div>';
    }
  }
  box.innerHTML = h;
  const save = $('#vfSave'); if (save) save.disabled = !!(c && c._st === 'DEAD' && !isBoss());
  if (F.catFor !== F.custId) {
    F.catFor = F.custId;
    const html = c ? catFieldsHtml(c.type, c.fields) : '', cat = $('#vfCat'), t = $('#vfCatT');
    cat.innerHTML = html ? '<div class="form-grid">' + html + '</div><span class="hint">Fill what you find out — it updates the customer.</span>' : '';
    cat.hidden = t.hidden = !html;
    if (html) t.textContent = '5 · ' + c.type + ' details';
  }
}

function paintMedia() {
  const F = S.form, el = $('#mGrid'); if (!F || !el) return;
  const maxAge = Number(S.settings.mediaMaxAge) * 6e4;
  el.innerHTML = F.media.map((m, i) => {
    const old = m.takenAt && Date.now() - m.takenAt > maxAge;
    return '<div class="mitem' + (m.type === 'video' ? ' vid' : '') + '">' + (m.type === 'video' ? '<video src="' + m.prev + '" muted playsinline preload="metadata"></video>' : '<img src="' + m.prev + '" alt="">') +
      '<span class="mtag' + (old ? ' old' : '') + '">' + (old ? 'Not live!' : m.tag === 'shop' ? 'Front' : m.type) + '</span>' + (m.url ? '' : '<button type="button" class="mx" data-act="rmMedia" data-i="' + i + '" aria-label="Remove">×</button>') + '</div>';
  }).join('');
}
function currentShopName() { const F = S.form, c = F && S.C.get(F.custId); return c ? c.shop : ''; }
async function addMedia(files, kind) {
  const F = S.form; if (!F) return;
  if (!F.gps && !isBoss()) return toast('Wait for the location first', 'err');
  const G = F.gps || { lat: '', lng: '' };
  for (const file of Array.from(files || [])) {
    const takenAt = file.lastModified || Date.now();
    if (kind === 'video') {
      if (file.size > 100 * 1048576) { toast('That video is ' + Math.ceil(file.size / 1048576) + ' MB — record a shorter clip (max 100 MB)', 'err'); continue; }
      const ext = (file.name.match(/\.(\w{2,5})$/) || [, 'mp4'])[1];
      F.media.push({ type: 'video', tag: 'video', blob: file, mime: file.type || 'video/mp4', name: 'visit_' + stampName() + '.' + ext, takenAt, lat: G.lat, lng: G.lng, prev: URL.createObjectURL(file) });
    } else {
      const lines = [(currentShopName() || 'Customer visit') + ' · ' + S.me.name, fmtDT(takenAt) + (Math.abs(Date.now() - takenAt) > 60000 ? ' (photo time)' : ''), F.gps ? 'GPS ' + F.gps.lat + ', ' + F.gps.lng + ' ±' + F.gps.acc + ' m' : 'Office entry · no GPS'];
      let blob; try { blob = await stampPhoto(file, lines); } catch (e) { blob = file; }
      F.media.push({ type: 'photo', tag: kind === 'shop' || !F.media.some(m => m.tag === 'shop') ? 'shop' : 'photo', blob, mime: 'image/jpeg', name: 'visit_' + stampName() + '.jpg', takenAt, lat: G.lat, lng: G.lng, prev: URL.createObjectURL(blob) });
    }
    if (F.gps && takenAt < Date.now() - Number(S.settings.mediaMaxAge) * 6e4) toast('That file was not taken just now — the visit will be flagged. Use the camera.', 'err');
  }
  paintMedia();
}

async function submitVisit(f) {
  const F = S.form, E = f.elements;
  if (!F) return;
  const bad = (el, msg) => { if (el) { el.classList.add('err'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } toast(msg, 'err'); };
  if (!F.gps && !isBoss()) return toast('No location yet — wait for GPS or tap Retry', 'err');
  const c = S.C.get(F.custId);
  if (!c) return bad($('#vfShop'), 'Pick the customer (or tap “+ New customer”)');
  if (c._st === 'DEAD' && !isBoss()) return toast('This customer is red-flagged — a manager must reopen it first', 'err');
  if (F.gps && !F.media.some(m => m.type === 'photo')) return toast('Take at least one photo at the customer', 'err');
  const fields = ((S.forms || {})[c.type] || []).length ? readCatFields(f, c.type) : null;
  if (!E.outcome.value) return bad(E.outcome, 'Pick what happened');
  const lr = E.leadResult.value;
  if (!lr) return bad($('.lres'), 'Pick the lead result: keep working, successful or not worth it');
  if (lr === 'DEAD' && !E.resultReason.value) return bad(E.resultReason, 'Say why it is not worth it — others will see this');
  if (lr === 'WORKING' && !E.next.value) return bad(E.next, 'Pick the next visit date');
  if (fields && lr !== 'DEAD') { const miss = missingReq(c.type, fields); if (miss) return bad($('[name="cf_' + ((S.forms[c.type] || []).find(x => x.l === miss) || {}).k + '"]', f), 'Fill “' + miss + '”'); }
  const brands = $$('input[name=brand]:checked', f).map(x => x.value).concat(splitList(E.otherBrand.value));
  const rates = $$('.rrow', f).map(r => ({ brand: r.querySelector('[name=rb]').value.trim(), product: r.querySelector('[name=rp]').value.trim(), thk: r.querySelector('[name=rt]').value, rate: r.querySelector('[name=rr]').value })).filter(r => r.brand && r.rate);
  rates.forEach(r => { if (!brands.some(b => brandKey(b) === brandKey(r.brand))) brands.push(r.brand); });
  const btn = $('#vfSave'); busy(btn, true);
  try {
    const todo = F.media.filter(m => !m.url);
    for (let i = 0; i < todo.length; i++) {
      const m = todo[i], r = await uploadBlob(m.blob, m.name, m.mime, (m.type === 'video' ? 'Video' : 'Photo') + ' ' + (i + 1) + ' of ' + todo.length);
      m.url = r.url; paintMedia();
    }
    upDone();
    const g = F.gps || { at: Date.now(), lat: '', lng: '', acc: '' };
    const d = { custId: c.id, at: g.at, lat: g.lat, lng: g.lng, acc: g.acc, deviceNow: Date.now(), outcome: E.outcome.value, interest: E.interest.value, potential: E.potential.value,
      leadResult: lr, resultReason: E.resultReason.value, fields, brands, rates, notes: E.notes.value.trim(), nextFollow: E.next.value && lr !== 'DEAD' ? dayStart(E.next.value) : '',
      standRec: E.standRec.value, standRecReason: E.standRecReason.value,
      media: F.media.map(m => ({ url: m.url, type: m.type, tag: m.tag, takenAt: m.takenAt, lat: m.lat, lng: m.lng, name: m.name })) };
    const r = await api('saveVisit', S.token, d);
    F.media.forEach(m => { try { URL.revokeObjectURL(m.prev); } catch (e) {} });
    putC(r.cust); putV(r.visit); persist();
    closeModal(true);
    const fl = prepV(r.visit)._f;
    if (r.visit.source === 'OFFICE') toast('Saved as office entry ✓' + (lr === 'DEAD' ? ' — customer red-flagged 🚩' : ''), 'ok'); else
    toast(fl.length ? 'Visit saved — flagged: ' + fl.map(x => DEF.flags[x]).join(', ') : lr === 'DEAD' ? 'Visit saved — customer red-flagged 🚩' : lr === 'WON' ? 'Visit saved — successful lead ✓' : 'Visit saved ✓ Next visit ' + fmtDay(r.cust.nextFollow), fl.length ? 'err' : 'ok');
    refresh();
  } catch (e) { upDone(); busy(btn, false); toast(e.message, 'err'); }
}

async function initPinMap() {

/** "26.91, 75.78", a Google Maps link (…@lat,lng… / !3dlat!4dlng / ?q=lat,lng). */
function parseCoords(s) {
  s = String(s || ''); try { s = decodeURIComponent(s); } catch (e) {}
  const m = s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/) || s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/) || s.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (!m) return null;
  const lat = +(+m[1]).toFixed(6), lng = +(+m[2]).toFixed(6);
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
}

function bindEvents() {
  document.addEventListener('click', e => {
    const side = $('#side');
    if (side.classList.contains('on') && !e.target.closest('#side') && !e.target.closest('[data-act=menu]')) side.classList.remove('on');
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn) { if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'loginForm') { e.preventDefault(); return doLogin(f); }
    const fn = FORMS[f.dataset.form];
    if (fn) { e.preventDefault(); fn(f); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('input[type=file][data-cap]')) { addMedia(t.files, t.dataset.cap); t.value = ''; return; }
    if (t.matches('input[type=file][data-crec]')) { addRec(t.files); t.value = ''; return; }
    if (t.matches('input[type=file][data-sfile]')) { const fl = t.files && t.files[0]; if (fl && S.form) { if (fl.size > 100 * 1048576) { toast('File is over 100 MB', 'err'); } else { S.form.files[t.dataset.sfile] = fl; const el = $('#sf_' + t.dataset.sfile); if (el) el.textContent = '✓ ' + (fl.name || 'photo') + ' · ' + (fl.size / 1048576).toFixed(1) + ' MB'; } } t.value = ''; return; }
    if (t.id === 'clShop') { const m = t.value.match(/\[(C\d+)\]\s*$/), c = m && S.C.get(m[1]); S.form.custId = c ? c.id : ''; t.classList.toggle('err', !c && !!t.value); paintCallInfo(); return; }
    if (t.name === 'callStatus' && t.form) { syncCall(t.form); return; }
    if (t.name === 'purpose' && t.form && t.form.dataset.form === 'call') { paintCallQs(t.form); return; }
    if (t.dataset.ob) { S.ob[t.dataset.ob] = t.value; obSave(); renderView(); return; }
    if (t.dataset.obc) { const c = S.ob.col[t.dataset.k] = S.ob.col[t.dataset.k] || {}; c[t.dataset.obc] = t.type === 'checkbox' ? t.checked : t.value; obSave(); renderView(); return; }
    if (t.dataset.pa || t.dataset.pcd) {
      const c = S.C.get(t.dataset.id); if (!c) return;
      const allow = Object.keys(DEF.payAllow).filter(k => k === t.dataset.pa ? t.checked : String(c.payAllow || '').indexOf(k) >= 0);
      const days = t.dataset.pcd ? Number(t.value) : creditMax(c) || 30;
      api('setPayAllow', S.token, c.id, allow, days).then(r => {
        putC(r.cust); persist(); renderView();
        toast(r.cust.shop + ': ' + (creditMax(r.cust) ? 'credit up to ' + creditMax(r.cust) + ' days · ' : '') + termsFor(r.cust).filter(x => !/credit/.test(x)).join(', '), 'ok');
      }).catch(e => { if (t.type === 'checkbox') t.checked = !t.checked; toast(e.message, 'err'); });
      return;
    }
    if (t.dataset.oe) { const E = OE(); if (t.dataset.oe === 'label') E.labels[t.dataset.k] = t.value.trim(); else E.tat[t.dataset.k] = Number(t.value); return; }
    if (t.dataset.oa) { const a = OE().answers[t.dataset.k][+t.dataset.i]; if (a) a[t.dataset.oa] = t.value; return; }
    if (t.name === 'ans' && t.form && t.form.dataset.form === 'step') { syncStepAns(t.form); return; }
    if ((t.name === 'ou' && t.closest('#oLines')) || (t.name === 'gst' && t.form && t.form.dataset.form === 'order')) { calcOrder(); return; }
    if (t.name === 'op' && t.closest('.oline')) { const s2 = t.closest('.oline').querySelector('[name=ot]'); s2.innerHTML = opts(thkFor(t.value, s2.value), s2.value, 'Thickness'); return; }
    if (t.name === 'rp' && t.closest('.rrow')) { const s2 = t.closest('.rrow').querySelector('[name=rt]'); s2.innerHTML = opts(thkFor(t.value, s2.value), s2.value, 'Thickness'); return; }
    if (t.id === 'oShop') { const m = t.value.match(/\[(C\d+)\]\s*$/), c = m && S.C.get(m[1]), sel = $('#oTerms'); if (sel) { sel.innerHTML = termsOpts(c, sel.value); $('#oTermsHint').textContent = termsHint(c); } return; }
    if (t.dataset.lf) { S.lf[t.dataset.lf] = t.value; LS.set('dm_lf', S.lf); S.limit = 150; renderView(); return; }
    if (t.matches('input[type=file][data-pup]')) { prodUpload(t.files, t.dataset.pup); t.value = ''; return; }
    if (t.id === 'vfShop') {
      const m = t.value.match(/\[(C\d+)\]\s*$/), c = m && S.C.get(m[1]);
      S.form.custId = c ? c.id : ''; t.classList.toggle('err', !c && !!t.value);
      if (c) prefillBrands(c); else if (t.value) toast('Pick a customer from the list, or tap “+ New customer”', 'err');
      paintCust(); return;
    }
    if (t.id === 'pinPaste') {
      const pc = parseCoords(t.value);
      if (pc) { placePin(pc.lat, pc.lng, 'map'); t.value = ''; }
      else if (t.value) toast('Could not read a location. Short links (maps.app.goo.gl) don’t work — copy the numbers, e.g. 26.9124, 75.7873', 'err');
      return;
    }
    if (t.name === 'type' && t.form && t.form.dataset.form === 'cust' && S.form) { const old = readCatFields(t.form, S.form.cat); S.form.cat = t.value; paintCatFields(old); return; }
    if (t.name === 'leadResult' && t.form && t.form.dataset.form === 'visit') { syncLeadResult(t.form); return; }
    if (t.dataset.fc) { S.fcat = t.value; renderView(); return; }
    if (t.dataset.fe) {
      const f = (FE()[S.fcat] || [])[+t.dataset.i]; if (!f) return;
      if (t.dataset.fe === 'r') { if (t.checked) f.r = true; else delete f.r; renderView(); }
      else if (t.dataset.fe === 't') { f.t = t.value; if ((f.t === 'select' || f.t === 'multi') && !f.o) f.o = []; if (f.t !== 'select' && f.t !== 'multi') delete f.o; renderView(); }
      return;
    }
    if (t.name === 'standRec' && t.form && t.form.dataset.form === 'visit') { $('#srReason').innerHTML = standReasonOpts(t.value); return; }
    if (t.name === 'status' && t.form && t.form.dataset.form === 'stand') { syncStandForm(t.form); return; }
    if (t.dataset.vf) { S.vf[t.dataset.vf] = t.value; LS.set('dm_vf', S.vf); S.limit = 150; renderView(); return; }
    if (t.dataset.cf) { S.cf[t.dataset.cf] = t.value; LS.set('dm_cf', S.cf); S.limit = 150; renderView(); return; }
    if (t.dataset.an) { S.an[t.dataset.an] = t.value; renderView(); return; }
    if (t.dataset.au) { S.au[t.dataset.au] = t.value; S.au.map = ''; renderView(); return; }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.classList.contains('err')) t.classList.remove('err');
    if (t.type === 'date' && t.parentNode.classList.contains('dwrap')) t.parentNode.classList.toggle('has', !!t.value);
    if (t.closest('#oLines') || (t.name === 'discount' && t.form && t.form.dataset.form === 'order')) calcOrder();
    if (t.id === 'ocq') { S.ocq = t.value; clearTimeout(S._ocqT); S._ocqT = setTimeout(() => { renderView(); const q = $('#ocq'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); }
    if (t.dataset.fe === 'l' || t.dataset.fe === 'o') {
      const f = (FE()[S.fcat] || [])[+t.dataset.i];
      if (f) { if (t.dataset.fe === 'l') f.l = t.value; else f.o = t.value.split(',').map(x => x.trim()).filter(Boolean); }
      const pv = $('#fePrev'); if (pv) pv.innerHTML = catFieldsHtml(S.fcat, {}, FE()[S.fcat]) || '<span class="hint">Nothing extra.</span>';
    }
    if (t.form && t.form.dataset.form === 'cust' && (t.name === 'shop' || t.name === 'mobile')) dupHint(t.form);
  });
  document.addEventListener('error', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.dataset.th) { const s = document.createElement('span'); s.className = 'fi'; s.textContent = '🖼'; t.replaceWith(s); }
  }, true);
  $('#q').addEventListener('input', onSearch);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  new MutationObserver(() => enhanceDates($('#modalBody'))).observe($('#modalBody'), { childList: true, subtree: true }); // also dates added later (category / call questions)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#lightbox').classList.contains('on')) { $('#lightbox').classList.remove('on'); $('#lightbox').innerHTML = ''; } else if ($('#modal').classList.contains('on')) closeModal(); else if (S.open) closeDrawer(); }
    if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); $('#q').focus(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me && Date.now() - (S.lastSync || 0) > 15000) doSync(); });
  setInterval(() => { if (S.me && document.visibilityState === 'visible') doSync(); }, 60000);
}
async function doLogin(f) {
  const btn = $('#loginBtn'), err = $('#loginErr'); err.hidden = true; busy(btn, true);
  try {
    const r = await api('login', f.elements.u.value, f.elements.p.value);
    S.token = r.token; LS.set('dm_token', r.token);
    S.view = 'dash'; LS.set('dm_view', 'dash'); S.adm = null; S.ledit = null;
    ingest(r.boot); showApp(); render(); postBoot();
    f.reset();
  } catch (e) { err.textContent = e.message; err.hidden = false; }
  busy(btn, false);
}
async function doSync(manual) {
  if (S.syncing || !S.token) return;
  S.syncing = 1;
  try {
    const p = await api('sync', S.token, S.since);
    const changed = ingest(p);
    S.lastSync = Date.now(); setSync('live');
    if (changed || manual) refresh(true); else renderNav();
    if (manual) toast(changed ? 'Updated' : 'Already up to date');
  } catch (e) { setSync('off'); if (manual) toast(e.message, 'err'); }
  finally { S.syncing = 0; }
}

start();
})();
</script>
