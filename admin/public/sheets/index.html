<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw data</title>
<link rel="stylesheet" href="./theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #fff; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; font: 13px/1.3 Inter, system-ui, sans-serif;
         border-bottom: 1px solid #e6e2d8; background: #faf8f3; color: #3a372f; flex: none; }
  #bar b { font-weight: 600; }
  #bar .sp { flex: 1; }
  #bar button { font: inherit; padding: 4px 10px; border: 1px solid #d6d1c4; border-radius: 6px; background: #fff; cursor: pointer; }
  #bar button:hover { background: #f3efe6; }
  #state { min-width: 9em; text-align: right; }
  #state.busy { color: #9a6a00; } #state.bad { color: #b3261e; font-weight: 600; } #state.ok { color: #2f7a4b; }
  #note { color: #7a7566; }
  #sheetHost { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #sheetHost .ms { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #sheetHost .ms-scroll { flex: 1; height: auto !important; min-height: 120px; }
  .ms-role-banner, #msViewTabs { display: none !important; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 14px Inter, system-ui, sans-serif; color: #7a7566; background: #fff; z-index: 50; }
</style>
</head>
<body data-theme="light" data-mode="sheet">
  <div id="bar">
    <b id="tabName">&nbsp;</b><span id="dims"></span><span id="note"></span>
    <span class="sp"></span>
    <span id="state"></span>
    <button id="reload" type="button" title="Load the latest rows from the server">Refresh</button>
  </div>
  <div id="sheetHost"></div>
  <div class="toast" id="toast"></div>
  <div id="loading">Loading…</div>
  <script type="module" src="./editor.js"></script>
</body>
</html>
