# docker compose up -d --build
# Set DOMAIN, POSTGRES_PASSWORD and ADMIN_PASSWORD in a .env file next to this one (see .env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: levanto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: levanto
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levanto"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://levanto:${POSTGRES_PASSWORD}@db:5432/levanto
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SUPER_ADMINS: ${SUPER_ADMINS:-admin}
      TRUST_PROXY: "1"
    volumes:
      - media:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  dbdata:
  media:
  caddydata:
